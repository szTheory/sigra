name: Release Receipt Canary
run-name: phase255-diagnostics-${{ inputs.scenario }}-${{ inputs.probe_id }}

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Non-publishing retained diagnostics scenario
        type: choice
        required: true
        options: [success, failure, cancellation]
      probe_id:
        description: Unique canary invocation identifier
        type: string
        required: true
      tested_source_sha:
        description: Production diagnostics source under test
        type: string
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: phase255-diagnostics-${{ inputs.probe_id }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  diagnostic-fixture:
    name: Phase 255 diagnostic fixture (${{ inputs.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Create invocation-owned synthetic diagnostic
        env:
          SCENARIO: ${{ inputs.scenario }}
          PROBE_ID: ${{ inputs.probe_id }}
          TESTED_SOURCE_SHA: ${{ inputs.tested_source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_ID: diagnostic-fixture
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase255-diagnostics"
          python3 -B -c 'import datetime,json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"phase255-diagnostics/scenario.json"; p.write_text(json.dumps({"scenario":os.environ["SCENARIO"],"probe_id":os.environ["PROBE_ID"],"source_sha":os.environ["TESTED_SOURCE_SHA"],"fixture_commit":os.environ["GITHUB_SHA"],"run_id":os.environ["RUN_ID"],"run_attempt":os.environ["RUN_ATTEMPT"],"job_id":os.environ["JOB_ID"],"captured_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"capture_state":"partial" if os.environ["SCENARIO"]=="cancellation" else "complete","expected_missing":["final-output.log","final-trace.zip"] if os.environ["SCENARIO"]=="cancellation" else []},sort_keys=True,indent=2)+chr(10))'
          python3 -B scripts/ci/ci-diagnostics-canary.py manifest \
            --invocation-root "$RUNNER_TEMP/phase255-diagnostics" \
            --output "$RUNNER_TEMP/phase255-diagnostics/manifest.json" \
            --invocation-id "$PROBE_ID" --source-sha "$TESTED_SOURCE_SHA" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --job-id "$JOB_ID" --seam "$SCENARIO" \
            --file scenario.json=report

      - name: Upload source-bound diagnostics
        if: always()
        uses: ./.github/actions/ci-diagnostic-upload
        with:
          invocation-root: ${{ runner.temp }}/phase255-diagnostics
          manifest: ${{ runner.temp }}/phase255-diagnostics/manifest.json
          bundle-output: ${{ runner.temp }}/phase255-diagnostics.zip
          artifact-name: sigra-ci-${{ inputs.tested_source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-diagnostic-fixture-${{ inputs.scenario }}-${{ inputs.probe_id }}

      - name: Deliberate fixture assertion failure
        if: inputs.scenario == 'failure'
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: python3 -B -c 'import os; assert os.environ["SCENARIO"] != "failure", "intentional Phase 255 fixture assertion"'
        shell: bash

      - name: Hold cancellation fixture after verified partial upload
        if: inputs.scenario == 'cancellation'
        timeout-minutes: 5
        run: sleep 300
