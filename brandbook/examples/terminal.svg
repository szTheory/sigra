<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Sigra terminal specimen</title>
  <desc id="desc">A terminal screenshot style specimen for Sigra install instructions.</desc>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <rect x="72" y="64" width="816" height="292" rx="16" fill="#171614"/>
  <text x="104" y="128" fill="#fdba74" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="18">$ mix deps.get</text>
  <text x="104" y="168" fill="#f4f1eb" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="18">$ mix sigra.install Accounts User users</text>
  <text x="104" y="224" fill="#5dd1a0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="18">Generated auth modules into your Phoenix app.</text>
  <text x="104" y="264" fill="#bdb5aa" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="18">Review routes, schemas, mailers, LiveViews, and policy seams.</text>
  <text x="104" y="304" fill="#fdba74" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="18">$ mix ecto.migrate</text>
</svg>
