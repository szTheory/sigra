<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Sigra README header specimen</title>
  <desc id="desc">A README header concept for Sigra using badges, a concise promise, and a terminal install snippet.</desc>
  <rect width="960" height="540" fill="#f6f5f2"/>
  <rect x="56" y="56" width="848" height="428" rx="18" fill="#ffffff" stroke="rgba(21,21,21,.12)"/>
  <g transform="translate(92 92)">
    <rect width="56" height="56" rx="12" fill="#c2410c"/>
    <path d="M20 16h-5v24h5M36 16h5v24h-5M28 14v28" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="28" r="7" fill="#fff0e8" stroke="#fff" stroke-width="4"/>
    <circle cx="28" cy="28" r="2.5" fill="#c2410c"/>
  </g>
  <text x="164" y="132" fill="#151515" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="800">Sigra</text>
  <text x="92" y="210" fill="#151515" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800">Production-minded authentication for Phoenix 1.8+</text>
  <text x="92" y="258" fill="#686868" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600">Library-owned security primitives plus generated host code your team can review.</text>
  <g transform="translate(92 304)" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800">
    <rect width="110" height="30" rx="15" fill="#151515"/><text x="18" y="20" fill="#fff">Hex 1.0</text>
    <rect x="126" width="146" height="30" rx="15" fill="#eef2ff"/><text x="146" y="20" fill="#1d4ed8">Phoenix 1.8+</text>
    <rect x="288" width="130" height="30" rx="15" fill="#fff0e8"/><text x="307" y="20" fill="#9a3412">MIT licensed</text>
  </g>
  <rect x="92" y="370" width="554" height="58" rx="10" fill="#151515"/>
  <text x="118" y="407" fill="#f4f1eb" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18">mix sigra.install Accounts User users</text>
</svg>
