<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Sigra component state specimen</title>
  <desc id="desc">Buttons, callouts, cards, and empty state examples for Sigra docs and marketing interfaces.</desc>
  <rect width="960" height="520" fill="#f6f5f2"/>
  <text x="64" y="72" fill="#151515" font-family="ui-sans-serif, system-ui" font-size="30" font-weight="800">Component States</text>
  <g font-family="ui-sans-serif, system-ui" font-size="16" font-weight="800">
    <rect x="64" y="112" width="148" height="48" rx="8" fill="#c2410c"/><text x="100" y="143" fill="#fff">Primary</text>
    <rect x="232" y="112" width="148" height="48" rx="8" fill="#fff" stroke="rgba(21,21,21,.16)"/><text x="265" y="143" fill="#151515">Secondary</text>
    <rect x="400" y="112" width="148" height="48" rx="8" fill="#ece7df"/><text x="438" y="143" fill="#8a8178">Disabled</text>
  </g>
  <g font-family="ui-sans-serif, system-ui" font-size="16" font-weight="800">
    <rect x="64" y="220" width="178" height="68" rx="10" fill="#ecfdf3"/><text x="88" y="260" fill="#176b43">Success</text>
    <rect x="264" y="220" width="178" height="68" rx="10" fill="#fff7e6"/><text x="288" y="260" fill="#a15c00">Warning</text>
    <rect x="464" y="220" width="178" height="68" rx="10" fill="#fff1f0"/><text x="488" y="260" fill="#b42318">Error</text>
    <rect x="664" y="220" width="178" height="68" rx="10" fill="#eef2ff"/><text x="688" y="260" fill="#1d4ed8">Info</text>
  </g>
  <rect x="64" y="344" width="310" height="108" rx="12" fill="#fff" stroke="rgba(21,21,21,.12)"/>
  <text x="88" y="386" fill="#151515" font-family="ui-sans-serif, system-ui" font-size="20" font-weight="800">Generated host code</text>
  <text x="88" y="420" fill="#686868" font-family="ui-sans-serif, system-ui" font-size="15" font-weight="600">Review and edit it in your app.</text>
  <rect x="420" y="344" width="310" height="108" rx="12" fill="#fff" stroke="rgba(21,21,21,.16)" stroke-dasharray="8 8"/>
  <text x="484" y="394" fill="#151515" font-family="ui-sans-serif, system-ui" font-size="20" font-weight="800">No audit rows yet</text>
  <text x="468" y="426" fill="#686868" font-family="ui-sans-serif, system-ui" font-size="15" font-weight="600">Events appear after auth activity.</text>
</svg>
