<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Sigra architecture diagram specimen</title>
  <desc id="desc">A diagram style for showing Sigra's library-owned core and host-owned generated Phoenix code.</desc>
  <rect width="960" height="520" fill="#f6f5f2"/>
  <text x="64" y="78" fill="#151515" font-family="ui-sans-serif, system-ui" font-size="32" font-weight="800">Library core + generated host code</text>
  <rect x="72" y="142" width="340" height="212" rx="16" fill="#151515"/>
  <text x="104" y="190" fill="#f4f1eb" font-family="ui-sans-serif, system-ui" font-size="24" font-weight="800">Sigra Hex package</text>
  <text x="104" y="232" fill="#bdb5aa" font-family="ui-sans-serif, system-ui" font-size="17" font-weight="600">Crypto, tokens, MFA, passkeys, plugs, behaviours.</text>
  <rect x="548" y="142" width="340" height="212" rx="16" fill="#ffffff" stroke="rgba(21,21,21,.14)"/>
  <text x="580" y="190" fill="#151515" font-family="ui-sans-serif, system-ui" font-size="24" font-weight="800">Your Phoenix app</text>
  <text x="580" y="232" fill="#686868" font-family="ui-sans-serif, system-ui" font-size="17" font-weight="600">Schemas, routes, LiveViews, mailers, product policy.</text>
  <path d="M424 248h102" stroke="#c2410c" stroke-width="6" stroke-linecap="round"/>
  <path d="M514 232l22 16-22 16" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="420" y="306" fill="#9a3412" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="800">generated calls into core</text>
  <rect x="104" y="278" width="152" height="38" rx="8" fill="#fff0e8"/>
  <text x="128" y="303" fill="#9a3412" font-family="ui-sans-serif, system-ui" font-size="14" font-weight="800">mix deps.update</text>
  <rect x="580" y="278" width="166" height="38" rx="8" fill="#fff0e8"/>
  <text x="606" y="303" fill="#9a3412" font-family="ui-sans-serif, system-ui" font-size="14" font-weight="800">code reviewable</text>
</svg>
