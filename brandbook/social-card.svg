<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sigra social preview card</title>
  <desc id="desc">A social preview card for Sigra, a production-minded authentication library for Phoenix 1.8 and later.</desc>
  <defs>
    <style>
      .bg { fill: #f6f5f2; }
      .panel { fill: #ffffff; stroke: rgba(21, 21, 21, 0.12); }
      .ink { fill: #151515; }
      .muted { fill: #686868; }
      .accent { fill: #c2410c; }
      .soft { fill: #fff0e8; }
      .type { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="630"/>
  <path d="M0 0h1200v24H0z" fill="#151515"/>
  <rect x="72" y="72" width="1056" height="486" rx="24" class="panel"/>
  <g transform="translate(112 112)">
    <rect width="72" height="72" rx="16" class="accent"/>
    <path d="M25 20h-6v32h6M47 20h6v32h-6M36 18v36" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="36" cy="36" r="9" fill="#fff0e8" stroke="#fff" stroke-width="5"/>
    <circle cx="36" cy="36" r="3.5" fill="#c2410c"/>
  </g>
  <text x="208" y="158" class="type ink" font-size="52" font-weight="800">Sigra</text>
  <text x="112" y="250" class="type ink" font-size="58" font-weight="800">Production-minded auth</text>
  <text x="112" y="318" class="type ink" font-size="58" font-weight="800">for Phoenix 1.8+</text>
  <text x="112" y="382" class="type muted" font-size="25" font-weight="600">Library-owned security core. Generated Phoenix code you can review.</text>
  <g transform="translate(112 438)">
    <rect width="500" height="64" rx="10" fill="#151515"/>
    <text x="24" y="40" class="mono" fill="#f4f1eb" font-size="22">mix sigra.install Accounts User users</text>
  </g>
