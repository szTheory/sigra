    <rect x="34" y="170" width="212" height="42" rx="8" fill="#ffffff"/>
    <rect x="34" y="234" width="120" height="42" rx="8" class="accent"/>
    <path d="M68 62h108M68 126h142M68 190h124" stroke="#686868" stroke-width="8" stroke-linecap="round"/>
    <path d="M188 255h28" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
