name: Terminal ratification evidence

on:
  workflow_dispatch:
    inputs:
      phase248_android_provision:
        description: 'Run the bounded Phase 248 Android provisioning receipt.'
        required: false
        type: boolean
        default: false
      phase248_android_compile:
        description: 'Compile and unit-test the Phase 248 Android shell at this exact SHA.'
        required: false
        type: boolean
        default: false
      phase248_ios_physical:
        description: 'Run the bounded Phase 248 live physical-iPhone proof at this exact SHA.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  capture:
    if: github.ref == 'refs/heads/main' && !inputs.phase248_android_provision && !inputs.phase248_android_compile && !inputs.phase248_ios_physical
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Capture fixed historical receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/capture-terminal-ratification-evidence.sh terminal-ratification-receipt.json
      - name: Attest receipt provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: terminal-ratification-receipt.json
      - name: Upload receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terminal-ratification-receipt
          path: terminal-ratification-receipt.json

  phase248_android_provision:
    if: inputs.phase248_android_provision
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision pinned Android proof environment
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/sigra-native-proof-android-sdk
        run: |
          set -euo pipefail
          sudo udevadm trigger --subsystem-match=misc --action=change || true
          sudo chown runner:docker /dev/kvm
          sudo chmod u+rw,g+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          mkdir -p "$ANDROID_SDK_ROOT"
          export SIGRA_ANDROID_SDKMANAGER="${ANDROID_HOME:?ANDROID_HOME is required}/cmdline-tools/latest/bin/sdkmanager"
          bash scripts/ci/native-proof-provision.sh --validate-android
      - name: Write exact-byte manifest
        run: |
          set -euo pipefail
          cd test/example/native/android
          files=(toolchain.lock.json gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties)
          sha256sum "${files[@]}" | LC_ALL=C sort > provisioned-files.sha256
          stat -c '%a %n' "${files[@]}" | LC_ALL=C sort > provisioned-files.mode
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -cf native-proof-android-provision.tar "${files[@]}" provisioned-files.sha256 provisioned-files.mode
          stage="$(mktemp -d)"
          python3 ../../../../scripts/ci/verify-native-proof-android-artifact.py native-proof-android-provision.tar "$stage"
          SIGRA_ANDROID_PROJECT_ROOT="$stage" bash ../../../../scripts/ci/native-proof-provision.sh --validate-android-lock
      - name: Upload Android provisioning evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-proof-android-provision-${{ github.sha }}
          path: test/example/native/android/native-proof-android-provision.tar
          retention-days: 7
          if-no-files-found: error

  phase248_android_compile:
    if: inputs.phase248_android_compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate immutable wrapper and Android coordinates
        run: |
          set -euo pipefail
          bash scripts/ci/native-proof-provision.sh --validate-android-lock
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('test/example/native/android')
          lock = json.loads((root / 'toolchain.lock.json').read_text())
          catalog = (root / 'gradle/libs.versions.toml').read_text()
          expected = {
              'agp': lock['agp'], 'kotlin': lock['kotlin'],
              'androidx-browser': lock['androidx_browser'],
              'androidx-test-core': lock['test_core'],
              'androidx-test-runner': lock['test_runner'],
              'espresso': lock['espresso'], 'uiautomator': lock['uiautomator'],
          }
          actual = dict(re.findall(r'^([a-z0-9-]+) = "([^"]+)"$', catalog, re.M))
          if any(actual.get(key) != value for key, value in expected.items()):
              raise SystemExit('version catalog does not match committed toolchain lock')
          build = (root / 'app/build.gradle.kts').read_text()
          if 'compileSdk = 36' not in build or 'targetSdk = 36' not in build or 'buildToolsVersion = "35.0.0"' not in build:
              raise SystemExit('Android SDK coordinates do not match committed toolchain lock')
          if 'com.android.library' in build or 'maven-publish' in build or 'publishing {' in build:
              raise SystemExit('Android shell must remain application-only')
          PY
      - name: Resolve, compile, and run substantive JVM contracts
        working-directory: test/example/native/android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain dependencies > phase248-dependencies.txt
          ./gradlew --no-daemon --console=plain assembleDebug assembleDebugAndroidTest testDebugUnitTest
      - name: Seal bounded compile evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('test/example/native/android')
          reports = sorted((root / 'app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          if not reports:
              raise SystemExit('no JVM unit-test result files were produced')
          tests = failures = errors = skipped = 0
          for report in reports:
              suite = ET.parse(report).getroot()
              tests += int(suite.attrib.get('tests', 0))
              failures += int(suite.attrib.get('failures', 0))
              errors += int(suite.attrib.get('errors', 0))
              skipped += int(suite.attrib.get('skipped', 0))
          if tests <= 0 or failures or errors or skipped:
              raise SystemExit('JVM unit-test evidence is incomplete')
          files = {
              'app_apk': root / 'app/build/outputs/apk/debug/app-debug.apk',
              'test_apk': root / 'app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk',
              'dependencies': root / 'phase248-dependencies.txt',
          }
          if any(not value.is_file() for value in files.values()):
              raise SystemExit('expected Android compile artifacts are missing')
          evidence = {
              'schema_version': 1,
              'implementation_sha': '${{ github.sha }}',
              'jvm_tests': tests,
              'failures': failures,
              'errors': errors,
              'skipped': skipped,
              'artifacts': {key: hashlib.sha256(value.read_bytes()).hexdigest() for key, value in files.items()},
              'complete': True,
          }
          output = root / 'phase248-android-compile-summary.json'
          output.write_text(json.dumps(evidence, sort_keys=True, separators=(',', ':')) + '\n')
          PY
      - name: Upload Android compile evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-proof-android-compile-${{ github.sha }}
          path: |
            test/example/native/android/phase248-android-compile-summary.json
            test/example/native/android/phase248-dependencies.txt
            test/example/native/android/app/build/outputs/apk/debug/app-debug.apk
            test/example/native/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            test/example/native/android/app/build/test-results/testDebugUnitTest/TEST-*.xml
          retention-days: 7
          if-no-files-found: error

  phase248_ios_physical:
    if: inputs.phase248_ios_physical
    runs-on: [self-hosted, macOS, ARM64, sigra-ios-physical]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision isolated proof database
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/db/up.sh >/dev/null
          source tmp/db.env
          for name in PGHOST PGPORT; do
            printf '%s=%s\n' "$name" "${!name:?}" >> "$GITHUB_ENV"
          done
      - name: Validate hermetic physical proof mechanics
        run: bash scripts/ci/crosswake-native-ios-proof.test.sh
      - name: Execute live physical-iPhone proof
        env:
          SIGRA_IOS_RUNNER_LABELS: self-hosted,macOS,ARM64,sigra-ios-physical
        run: bash scripts/ci/crosswake-native-ios-proof.sh
      - name: Upload redacted physical-iPhone receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-proof-ios-physical-${{ github.sha }}
          path: .planning/phases/248-crosswake-native-proof/248-IOS-EVIDENCE.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove isolated proof database
        if: always()
        run: bash scripts/db/down.sh --purge
