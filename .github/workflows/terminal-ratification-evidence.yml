name: Terminal ratification evidence

on:
  workflow_dispatch:
    inputs:
      phase248_android_provision:
        description: 'Run the bounded Phase 248 Android provisioning receipt.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Capture fixed historical receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/capture-terminal-ratification-evidence.sh terminal-ratification-receipt.json
      - name: Attest receipt provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: terminal-ratification-receipt.json
      - name: Upload receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terminal-ratification-receipt
          path: terminal-ratification-receipt.json

  phase248_android_provision:
    if: inputs.phase248_android_provision
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision pinned Android proof environment
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/sigra-native-proof-android-sdk
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT"
          export SIGRA_ANDROID_SDKMANAGER="${ANDROID_HOME:?ANDROID_HOME is required}/cmdline-tools/latest/bin/sdkmanager"
          bash scripts/ci/native-proof-provision.sh --validate-android
      - name: Write exact-byte manifest
        run: |
          set -euo pipefail
          cd test/example/native/android
          sha256sum toolchain.lock.json gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties > provisioned-files.sha256
      - name: Upload Android provisioning evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-proof-android-provision-${{ github.sha }}
          path: |
            test/example/native/android/toolchain.lock.json
            test/example/native/android/gradlew
            test/example/native/android/gradlew.bat
            test/example/native/android/gradle/wrapper/gradle-wrapper.jar
            test/example/native/android/gradle/wrapper/gradle-wrapper.properties
            test/example/native/android/provisioned-files.sha256
          retention-days: 7
          if-no-files-found: error
