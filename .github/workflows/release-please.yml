# Release Please opens/updates a Release PR from conventional commits on main.
# When that PR is merged, Release Please creates the GitHub Release + v* tag,
# gate-ci-green verifies CI passed on the release SHA, then publish-hex publishes
# to Hex with HEX_API_KEY.
#
# Requires repository secret: HEX_API_KEY (Actions secrets).
# RELEASE_PLEASE_TOKEN: optional fine-grained PAT. Using it for Release Please
# makes release-branch pushes and PRs run required CI (GITHUB_TOKEN does not
# chain-trigger other workflows). Also use if branch rules block the default token.

name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect already-tagged release PR
        id: release-preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          pr_number=""
          if [[ "${COMMIT_MESSAGE:-}" =~ Merge\ pull\ request\ #([0-9]+) ]]; then
            pr_number="${BASH_REMATCH[1]}"
          fi

          if [ -z "$pr_number" ]; then
            echo "No merge PR number in head commit; running release-please."
            echo "should_run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          labels="$(gh pr view "$pr_number" --json labels --jq '.labels[].name' 2>/dev/null || true)"
          if grep -qx 'autorelease: tagged' <<<"$labels"; then
            echo "Release PR #$pr_number is already tagged; skipping release-please rerun."
            echo "should_run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -Eq 'autorelease: pending|autorelease: snapshot' <<<"$labels"; then
            echo "PR #$pr_number is not a Release Please PR; running release-please."
            echo "should_run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          expected_tag="v$(jq -r '.["."]' .release-please-manifest.json)"
          if gh release view "$expected_tag" >/dev/null 2>&1; then
            echo "GitHub release $expected_tag already exists for merged PR; skipping rerun."
            echo "should_run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release PR #$pr_number not fully published yet; running release-please."
          echo "should_run=true" >>"$GITHUB_OUTPUT"

      - name: Run Release Please
        id: release
        if: ${{ steps.release-preflight.outputs.should_run == 'true' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Optional: set secret RELEASE_PLEASE_TOKEN (fine-grained PAT) if the
          # default token cannot open Release PRs; otherwise github.token suffices.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  gate-ci-green:
    name: Verify CI is green on release SHA
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      actions: write
      contents: read
    steps:
      # Phase 231 (DX-05 / D-21): the inline `run:` body below has no repo files of
      # its own to read; this checkout exists solely so the extracted
      # scripts/ci/wait-for-ci-gate.sh is present on the runner for the step after it
      # to invoke -- the previous inline-shell version of this job needed no checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Phase 231 (DX-05 / D-20, D-21): the 58-line inline poll loop that used to live
      # here is extracted into scripts/ci/wait-for-ci-gate.sh so it can be reached by a
      # hermetic self-test (wait-for-ci-gate.test.sh, wired into fast_checks) and by a
      # live invocation against a real completed run -- see this phase's SUMMARY for
      # the receipt. --max-attempts 120 (was the inline 60) raises the polling ceiling
      # to 60 minutes at the unchanged 30s interval, above the measured 28m29s
      # post-230 push wall-clock (run 30466318240) and its 42.3m historical max;
      # `timeout-minutes: 75` above replaces the previously-inherited 360-minute
      # default with an explicit ceiling comfortably above that 60-minute poll budget.
      - name: Wait for ci-gate on release SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: bash scripts/ci/wait-for-ci-gate.sh --max-attempts 120

  publish-hex:
    name: Publish to Hex.pm
    needs: [release-please, gate-ci-green]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sigra_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache library deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      # Matches library_tests in ci.yml: InstallFixture shells out to mix phx.new.
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new 1.8.8

      - name: Fetch library deps
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Verify release version in mix.exs
        run: grep -nF "@version \"${{ needs.release-please.outputs.version }}\"" mix.exs

      - name: Verify tag matches release version
        run: |
          set -euo pipefail
          expected_tag="v${{ needs.release-please.outputs.version }}"
          actual_tag="${{ needs.release-please.outputs.tag_name }}"
          if [ "$actual_tag" != "$expected_tag" ]; then
            echo "Release Please output mismatch: tag=$actual_tag expected=$expected_tag"
            exit 1
          fi
          echo "tag/version truth verified: $actual_tag"

      - name: Verify release version in release-please-manifest
        run: |
          set -euo pipefail
          expected_version="${{ needs.release-please.outputs.version }}"
          actual_version="$(grep -oE '"\."\s*:\s*"[^"]+"' .release-please-manifest.json | sed -E 's/.*"([^"]+)"$/\1/')"
          if [ -z "$actual_version" ]; then
            echo "Unable to read version from .release-please-manifest.json"
            exit 1
          fi
          if [ "$actual_version" != "$expected_version" ]; then
            echo "Manifest version mismatch: manifest=$actual_version expected=$expected_version"
            exit 1
          fi
          echo "manifest/version truth verified: $actual_version"

      - name: Verify docs source_ref follows version
        run: |
          grep -n 'source_ref: "v#{@version}"' mix.exs

      - name: Run library tests
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test

      - name: Check docs build cleanly
        run: mix docs --warnings-as-errors

      - name: Inspect packaged files
        run: |
          set -euo pipefail
          mix hex.build --unpack --output sigra-hex-inspect
          test -f sigra-hex-inspect/README.md
          test -f sigra-hex-inspect/CHANGELOG.md
          test -f sigra-hex-inspect/mix.exs
          test -d sigra-hex-inspect/lib
          if [ -e sigra-hex-inspect/.planning ]; then
            echo "Package contains forbidden .planning directory"
            exit 1
          fi

      - name: Skip if version already on Hex
        id: idempotency
        run: |
          if mix hex.info sigra "${{ needs.release-please.outputs.version }}" 2>/dev/null | grep -q "Released:"; then
            echo "Version ${{ needs.release-please.outputs.version }} of sigra already on Hex - skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry run Hex publish
        if: steps.idempotency.outputs.skip != 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --dry-run --yes

      - name: Publish to Hex
        if: steps.idempotency.outputs.skip != 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      - name: Verify version on Hex.pm
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS "https://hex.pm/api/packages/sigra/releases/${VERSION}" | grep -q "\"version\""; then
              echo "Hex.pm lists sigra ${VERSION}"
              exit 0
            fi
            echo "waiting for Hex index... (${i}/36)"
            sleep 10
          done
          echo "Timed out waiting for https://hex.pm/api/packages/sigra/releases/${VERSION}"
          exit 1

      - name: Verify HexDocs source links after publish
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          scripts/ci/release-post-publish-verify.sh \
            --package sigra \
            --version "${VERSION}" \
            --tag "${TAG_NAME}" \
            --evidence-file release-post-publish-evidence.json

      - name: Upload release post-publish evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-post-publish-evidence-${{ needs.release-please.outputs.version }}
          path: release-post-publish-evidence.json
          if-no-files-found: ignore
          retention-days: 90

  # HARD-02 (Phase 222 Plan 02, D-06.3): release-please auto-publish previously
  # stalled silently for ~30 minutes when gate-ci-green timed out, or failed
  # quietly on a broken publish-hex step, with no failure consumer. This
  # aggregator job opens/updates a single durable tracking Issue via the
  # shared scripts/ci/notify-failure-issue.sh (D-07) whenever a real release
  # (release_created == 'true') hits a failed/cancelled gate-ci-green or
  # publish-hex. A separate aggregator (vs inline `if: failure()` steps in
  # each job) is used because gate-ci-green's timeout `exit 1` reliably
  # yields `result: failure`, which fires this downstream reporter.
  notify-release-failure:
    name: Notify on release-please publish/gate failure
    runs-on: ubuntu-latest
    needs: [release-please, gate-ci-green, publish-hex]
    if: >-
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      (needs.gate-ci-green.result == 'failure' || needs.gate-ci-green.result == 'cancelled' ||
       needs.publish-hex.result == 'failure' || needs.publish-hex.result == 'cancelled')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Open or update release-lane-rot tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: release-lane-rot
          TITLE: "release-please publish/gate failed (release-lane-rot)"
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE_CI_GREEN_RESULT: ${{ needs.gate-ci-green.result }}
          PUBLISH_HEX_RESULT: ${{ needs.publish-hex.result }}
        run: |
          set -euo pipefail
          FAILING_JOB="gate-ci-green"
          if [ "${PUBLISH_HEX_RESULT}" = "failure" ] || [ "${PUBLISH_HEX_RESULT}" = "cancelled" ]; then
            FAILING_JOB="publish-hex"
          fi
          echo "::error::release-please publish/gate failed for ${TAG_NAME:-<unknown tag>} -- opening/updating tracking issue release-lane-rot (failing job: ${FAILING_JOB})"
          BODY="release-please auto-publish did not complete for ${TAG_NAME:-<unknown tag>} (version ${VERSION:-<unknown>}).

          - Run: ${RUN_URL}
          - Failing job: ${FAILING_JOB} (gate-ci-green=${GATE_CI_GREEN_RESULT}, publish-hex=${PUBLISH_HEX_RESULT})

          This is the HARD-02 fail-loudly signal (Phase 222 Plan 02) -- release-please created the release but the CI-green gate or the Hex publish step did not finish successfully. See docs/release-runbook-v1-0.md for recovery/manual-dispatch steps. Investigate the linked run, then close this issue once resolved."
          export BODY
          bash scripts/ci/notify-failure-issue.sh
