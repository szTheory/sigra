# Release Please opens/updates a Release PR from conventional commits on main.
# When that PR is merged, Release Please creates the GitHub Release + v* tag,
# gate-ci-green verifies CI passed on the release SHA, then publish-hex publishes
# to Hex with a read-only dry-run key and a separate publish key held in the
# hex-publish environment. RELEASE_PLEASE_TOKEN is held only in release-automation.

name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read
  issues: read
  pull-requests: read

concurrency:
  group: release-please-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: release-automation
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      started_at: ${{ steps.workflow-start.outputs.started_at }}
      has_candidate: ${{ steps.capture-candidate.outputs.has_candidate }}
      candidate_identity: ${{ steps.capture-candidate.outputs.candidate_identity }}
      candidate_number: ${{ steps.capture-candidate.outputs.candidate_number }}
      candidate_head_sha: ${{ steps.capture-candidate.outputs.candidate_head_sha }}
      trusted_main_sha: ${{ steps.capture-candidate.outputs.trusted_main_sha }}
    steps:
      - name: Mark release workflow start
        id: workflow-start
        run: |
          printf 'started_at=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect already-tagged release PR
        id: release-preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          pr_number=""
          if [[ "${COMMIT_MESSAGE:-}" =~ Merge\ pull\ request\ #([0-9]+) ]]; then
            pr_number="${BASH_REMATCH[1]}"
          fi

          if [ -z "$pr_number" ]; then
            echo "No merge PR number in head commit; running release-please."
            echo "should_run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          labels="$(gh pr view "$pr_number" --json labels --jq '.labels[].name' 2>/dev/null || true)"
          if grep -qx 'autorelease: tagged' <<<"$labels"; then
            echo "Release PR #$pr_number is already tagged; skipping release-please rerun."
            echo "should_run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -Eq 'autorelease: pending|autorelease: snapshot' <<<"$labels"; then
            echo "PR #$pr_number is not a Release Please PR; running release-please."
            echo "should_run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          expected_tag="v$(jq -r '.["."]' .release-please-manifest.json)"
          if gh release view "$expected_tag" >/dev/null 2>&1; then
            echo "GitHub release $expected_tag already exists for merged PR; skipping rerun."
            echo "should_run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release PR #$pr_number not fully published yet; running release-please."
          echo "should_run=true" >>"$GITHUB_OUTPUT"

      - name: Verify credential environments and release token presence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_PLEASE_TOKEN_PRESENT: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          bash scripts/ci/release-environment-preflight.sh \
            --repository "$REPOSITORY" \
            --require-release-token "$RELEASE_PLEASE_TOKEN_PRESENT"

      - name: Run Release Please
        id: release
        if: ${{ steps.release-preflight.outputs.should_run == 'true' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Capture the one eligible Release Please candidate
        id: capture-candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/ci/refresh-release-docs.sh capture \
            --repository "$REPOSITORY" \
            --expected-main-sha "$WORKFLOW_SHA" \
            --identity-file "$RUNNER_TEMP/release-candidate.json" \
            --github-output "$GITHUB_OUTPUT"

  build-release-docs:
    name: Build release candidate docs without write credentials
    needs: release-please
    if: ${{ needs.release-please.outputs.has_candidate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted-main
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.release-please.outputs.candidate_head_sha }}
          path: candidate
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: candidate/.tool-versions
          version-type: strict

      - name: Install Hex and Rebar
        working-directory: candidate
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch candidate dependencies
        working-directory: candidate
        run: mix deps.get

      - name: Build candidate docs without credentials
        working-directory: candidate
        run: mix docs --warnings-as-errors

      - name: Package only the generated index and selected identity
        env:
          CANDIDATE_IDENTITY: ${{ needs.release-please.outputs.candidate_identity }}
        run: |
          set -euo pipefail
          identity_file="$RUNNER_TEMP/release-candidate.json"
          printf '%s\n' "$CANDIDATE_IDENTITY" > "$identity_file"
          bash trusted-main/scripts/ci/refresh-release-docs.sh package \
            --candidate-dir "$GITHUB_WORKSPACE/candidate" \
            --identity-file "$identity_file" \
            --output-dir "$RUNNER_TEMP/release-docs-artifact"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: release-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-docs-artifact
          if-no-files-found: error
          retention-days: 1

  write-release-docs:
    name: Write the exact generated index and confirm fresh CI
    needs: [release-please, build-release-docs]
    if: ${{ needs.release-please.outputs.has_candidate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-automation
    permissions:
      actions: read
      contents: read
      deployments: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted-main
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.release-please.outputs.candidate_head_sha }}
          path: candidate
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-docs-artifact

      - name: Verify release automation environment before write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_PLEASE_TOKEN_PRESENT: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          bash trusted-main/scripts/ci/release-environment-preflight.sh \
            --repository "$REPOSITORY" \
            --require-release-token "$RELEASE_PLEASE_TOKEN_PRESENT"

      - name: Prepare the selected candidate identity
        env:
          CANDIDATE_IDENTITY: ${{ needs.release-please.outputs.candidate_identity }}
        run: |
          set -euo pipefail
          printf '%s\n' "$CANDIDATE_IDENTITY" > "$RUNNER_TEMP/release-candidate.json"

      - name: Apply the generated index and prove exact-head CI registration
        id: write-candidate
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash trusted-main/scripts/ci/refresh-release-docs.sh write \
            --repository "$REPOSITORY" \
            --repo-dir "$GITHUB_WORKSPACE/candidate" \
            --artifact-dir "$RUNNER_TEMP/release-docs-artifact" \
            --identity-file "$RUNNER_TEMP/release-candidate.json" \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  gate-ci-green:
    name: Verify CI is green on release SHA
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    outputs:
      result: ${{ steps.wait.outputs.result }}
      gate_verdict: ${{ steps.wait.outputs.gate_verdict }}
      gate_attempts: ${{ steps.wait.outputs.attempts }}
      gate_started_at: ${{ steps.wait.outputs.started_at }}
      gate_completed_at: ${{ steps.wait.outputs.completed_at }}
      gate_run_id: ${{ steps.wait.outputs.gate_run_id }}
      gate_url: ${{ steps.wait.outputs.gate_url }}
    permissions:
      actions: write
      contents: read
    steps:
      # Phase 231 (DX-05 / D-21): the inline `run:` body below has no repo files of
      # its own to read; this checkout exists solely so the extracted
      # scripts/ci/wait-for-ci-gate.sh is present on the runner for the step after it
      # to invoke -- the previous inline-shell version of this job needed no checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Phase 231 (DX-05 / D-20, D-21): the 58-line inline poll loop that used to live
      # here is extracted into scripts/ci/wait-for-ci-gate.sh so it can be reached by a
      # hermetic self-test (wait-for-ci-gate.test.sh, wired into fast_checks) and by a
      # live invocation against a real completed run -- see this phase's SUMMARY for
      # the receipt. --max-attempts 120 (was the inline 60) raises the polling ceiling
      # to 60 minutes at the unchanged 30s interval, above the measured 28m29s
      # post-230 push wall-clock (run 30466318240) and its 42.3m historical max;
      # `timeout-minutes: 75` above replaces the previously-inherited 360-minute
      # default with an explicit ceiling comfortably above that 60-minute poll budget.
      - name: Wait for ci-gate on release SHA
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          GATE_STARTED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          GATE_ERROR_FILE="$RUNNER_TEMP/release-ci-gate-error.log"
          set +e
          RESULT="$(bash scripts/ci/wait-for-ci-gate.sh --max-attempts 120 --format json 2>"$GATE_ERROR_FILE")"
          RESULT_CODE=$?
          set -e
          GATE_COMPLETED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          if [[ "$RESULT_CODE" -eq 0 ]]; then
            GATE_VERDICT="pass"
            ATTEMPTS="$(jq -r '.attempts' <<<"$RESULT")"
            GATE_RUN_ID="$(jq -r '.run_id' <<<"$RESULT")"
            GATE_URL="$(jq -r '.run_url' <<<"$RESULT")"
            RESULT="$(jq -c --arg started "$GATE_STARTED_AT" --arg completed "$GATE_COMPLETED_AT" \
              '. + {gate_started_at:$started, gate_completed_at:$completed, gate_verdict:"pass"}' <<<"$RESULT")"
          else
            GATE_VERDICT="fail"
            ATTEMPTS="$(jq -r '.attempts // 0' <<<"$RESULT")"
            GATE_RUN_ID="$(jq -r 'if .run_id == null then "" else (.run_id | tostring) end' <<<"$RESULT")"
            GATE_URL="$(jq -r '.run_url // ""' <<<"$RESULT")"
            RESULT="$(jq -c --arg started "$GATE_STARTED_AT" --arg completed "$GATE_COMPLETED_AT" \
              '. + {gate_started_at:$started, gate_completed_at:$completed, gate_verdict:"fail"}' <<<"$RESULT")"
            cat "$GATE_ERROR_FILE" >&2
          fi

          {
            echo "result=${RESULT}"
            echo "gate_verdict=${GATE_VERDICT}"
            echo "attempts=${ATTEMPTS}"
            echo "started_at=${GATE_STARTED_AT}"
            echo "completed_at=${GATE_COMPLETED_AT}"
            echo "gate_run_id=${GATE_RUN_ID}"
            echo "gate_url=${GATE_URL}"
          } >> "$GITHUB_OUTPUT"
          exit "$RESULT_CODE"

  publish-hex:
    name: Publish to Hex.pm
    needs: [release-please, gate-ci-green]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    environment: hex-publish
    outputs:
      outcome: ${{ steps.capture-publish-result.outputs.outcome }}
      started_at: ${{ steps.capture-publish-result.outputs.started_at }}
      completed_at: ${{ steps.capture-publish-result.outputs.completed_at }}
      failure_stage: ${{ steps.capture-publish-result.outputs.failure_stage }}
      diagnostic: ${{ steps.capture-publish-result.outputs.diagnostic }}
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sigra_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: _trusted-release

      - name: Verify credential environments and required Hex credentials
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEX_DRY_RUN_API_KEY_PRESENT: ${{ secrets.HEX_DRY_RUN_API_KEY != '' }}
          HEX_API_KEY_PRESENT: ${{ secrets.HEX_API_KEY != '' }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/_trusted-release/scripts/ci/release-environment-preflight.sh" \
            --repository "$REPOSITORY" \
            --require-hex-dry-run-key "$HEX_DRY_RUN_API_KEY_PRESENT" \
            --require-hex-publish-key "$HEX_API_KEY_PRESENT"

      - name: Mark package verification start
        id: publish-start
        run: echo "started_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Verify release tag, source SHA, and checkout HEAD
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: bash scripts/ci/release-exact-source.sh

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache library deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      # Matches library_tests in ci.yml: InstallFixture shells out to mix phx.new.
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new 1.8.8

      - name: Fetch library deps
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Verify release version in mix.exs
        run: grep -nF "@version \"${{ needs.release-please.outputs.version }}\"" mix.exs

      - name: Verify tag matches release version
        run: |
          set -euo pipefail
          expected_tag="v${{ needs.release-please.outputs.version }}"
          actual_tag="${{ needs.release-please.outputs.tag_name }}"
          if [ "$actual_tag" != "$expected_tag" ]; then
            echo "Release Please output mismatch: tag=$actual_tag expected=$expected_tag"
            exit 1
          fi
          echo "tag/version truth verified: $actual_tag"

      - name: Verify release version in release-please-manifest
        run: |
          set -euo pipefail
          expected_version="${{ needs.release-please.outputs.version }}"
          actual_version="$(grep -oE '"\."\s*:\s*"[^"]+"' .release-please-manifest.json | sed -E 's/.*"([^"]+)"$/\1/')"
          if [ -z "$actual_version" ]; then
            echo "Unable to read version from .release-please-manifest.json"
            exit 1
          fi
          if [ "$actual_version" != "$expected_version" ]; then
            echo "Manifest version mismatch: manifest=$actual_version expected=$expected_version"
            exit 1
          fi
          echo "manifest/version truth verified: $actual_version"

      - name: Verify docs source_ref follows version
        run: |
          grep -n 'source_ref: "v#{@version}"' mix.exs

      - name: Run library tests
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test

      - name: Check docs build cleanly
        run: mix docs --warnings-as-errors

      - name: Inspect packaged files
        run: |
          set -euo pipefail
          mix hex.build --unpack --output sigra-hex-inspect
          test -f sigra-hex-inspect/README.md
          test -f sigra-hex-inspect/CHANGELOG.md
          test -f sigra-hex-inspect/mix.exs
          test -d sigra-hex-inspect/lib
          if [ -e sigra-hex-inspect/.planning ]; then
            echo "Package contains forbidden .planning directory"
            exit 1
          fi

      - name: Skip if version already on Hex
        id: idempotency
        run: |
          if mix hex.info sigra "${{ needs.release-please.outputs.version }}" 2>/dev/null | grep -q "Released:"; then
            echo "Version ${{ needs.release-please.outputs.version }} of sigra already on Hex - skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry run Hex publish
        id: dry-run
        if: steps.idempotency.outputs.skip != 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_DRY_RUN_API_KEY }}
        run: mix hex.publish --dry-run --yes

      - name: Publish to Hex
        id: publish
        if: steps.idempotency.outputs.skip != 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      - name: Verify version on Hex.pm
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS "https://hex.pm/api/packages/sigra/releases/${VERSION}" | grep -q "\"version\""; then
              echo "Hex.pm lists sigra ${VERSION}"
              exit 0
            fi
            echo "waiting for Hex index... (${i}/36)"
            sleep 10
          done
          echo "Timed out waiting for https://hex.pm/api/packages/sigra/releases/${VERSION}"
          exit 1

      - name: Verify HexDocs source links after publish
        id: verify-hexdocs
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          scripts/ci/release-post-publish-verify.sh \
            --package sigra \
            --version "${VERSION}" \
            --tag "${TAG_NAME}" \
            --evidence-file release-post-publish-evidence.json

      - name: Upload release post-publish evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-post-publish-evidence-${{ needs.release-please.outputs.version }}
          path: release-post-publish-evidence.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Capture publish outcome for terminal receipt
        id: capture-publish-result
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          ALREADY_PUBLISHED: ${{ steps.idempotency.outputs.skip }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify-hexdocs.outcome }}
          STARTED_AT: ${{ steps.publish-start.outputs.started_at }}
        run: |
          set -euo pipefail
          COMPLETED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          OUTCOME="failed"
          FAILURE_STAGE="publish-hex"
          DIAGNOSTIC="publish_job_failed"
          if [[ "$ALREADY_PUBLISHED" == "true" ]]; then
            OUTCOME="already_published"
            FAILURE_STAGE=""
            DIAGNOSTIC=""
          elif [[ "$PUBLISH_OUTCOME" == "success" ]]; then
            OUTCOME="published"
            if [[ "$VERIFY_OUTCOME" != "success" || "$JOB_RESULT" != "success" ]]; then
              FAILURE_STAGE="post-publish-verify"
              DIAGNOSTIC="post_publish_verification_failed"
            else
              FAILURE_STAGE=""
              DIAGNOSTIC=""
            fi
          fi
          [[ -n "$STARTED_AT" ]] || STARTED_AT="$COMPLETED_AT"
          {
            echo "outcome=${OUTCOME}"
            echo "started_at=${STARTED_AT}"
            echo "completed_at=${COMPLETED_AT}"
            echo "failure_stage=${FAILURE_STAGE}"
            echo "diagnostic=${DIAGNOSTIC}"
          } >> "$GITHUB_OUTPUT"

  record-release-result:
    name: Record terminal release result
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [release-please, gate-ci-green, publish-hex]
    if: >-
      always() && needs.release-please.outputs.release_created == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Build and validate terminal release receipt
        env:
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/release-please.yml
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_VERSION: ${{ needs.release-please.outputs.version }}
          SOURCE_TAG: ${{ needs.release-please.outputs.tag_name }}
          SOURCE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_STARTED_AT: ${{ needs.release-please.outputs.started_at }}
          GATE_JOB_RESULT: ${{ needs.gate-ci-green.result }}
          GATE_ATTEMPTS: ${{ needs.gate-ci-green.outputs.gate_attempts }}
          GATE_STARTED_AT: ${{ needs.gate-ci-green.outputs.gate_started_at }}
          GATE_COMPLETED_AT: ${{ needs.gate-ci-green.outputs.gate_completed_at }}
          GATE_RUN_ID: ${{ needs.gate-ci-green.outputs.gate_run_id }}
          GATE_URL: ${{ needs.gate-ci-green.outputs.gate_url }}
          GATE_RESULT: ${{ needs.gate-ci-green.outputs.result }}
          PUBLISH_JOB_RESULT: ${{ needs.publish-hex.result }}
          PUBLISH_OUTCOME: ${{ needs.publish-hex.outputs.outcome }}
          PUBLISH_STARTED_AT: ${{ needs.publish-hex.outputs.started_at }}
          PUBLISH_COMPLETED_AT: ${{ needs.publish-hex.outputs.completed_at }}
          PUBLISH_FAILURE_STAGE: ${{ needs.publish-hex.outputs.failure_stage }}
          PUBLISH_DIAGNOSTIC: ${{ needs.publish-hex.outputs.diagnostic }}
        run: |
          set -euo pipefail
          RELEASE_STARTED_AT="$(bash scripts/ci/normalize-release-timestamp.sh "$RELEASE_STARTED_AT")"
          RELEASE_COMPLETED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          GATE_VERDICT="fail"
          [[ "$GATE_JOB_RESULT" == "success" ]] && GATE_VERDICT="pass"
          GATE_ATTEMPTS="${GATE_ATTEMPTS:-0}"
          [[ "$GATE_ATTEMPTS" =~ ^[0-9]+$ ]] || GATE_ATTEMPTS=0
          GATE_RUN_ID="${GATE_RUN_ID:-}"
          GATE_URL="${GATE_URL:-}"
          PUBLISH_OUTCOME="${PUBLISH_OUTCOME:-not_run}"
          PUBLISH_FAILURE_STAGE="${PUBLISH_FAILURE_STAGE:-}"
          PUBLISH_DIAGNOSTIC="${PUBLISH_DIAGNOSTIC:-}"
          TERMINAL_VERDICT="success"
          FAILURE_JSON="null"
          if [[ "$GATE_VERDICT" != "pass" ]]; then
            TERMINAL_VERDICT="failure"
            FAILURE_JSON="{\"stage\":\"gate-ci-green\",\"diagnostic\":\"ci_gate_not_green\"}"
            PUBLISH_OUTCOME="not_run"
          elif [[ "$PUBLISH_JOB_RESULT" != "success" || "$PUBLISH_OUTCOME" == "failed" ]]; then
            TERMINAL_VERDICT="failure"
            STAGE="${PUBLISH_FAILURE_STAGE:-publish-hex}"
            DIAGNOSTIC="${PUBLISH_DIAGNOSTIC:-publish_job_failed}"
            FAILURE_JSON="$(jq -cn --arg stage "$STAGE" --arg diagnostic "$DIAGNOSTIC" '{stage:$stage,diagnostic:$diagnostic}')"
          fi
          if [[ -z "$PUBLISH_STARTED_AT" ]]; then PUBLISH_STARTED_AT="null"; fi
          if [[ -z "$PUBLISH_COMPLETED_AT" ]]; then PUBLISH_COMPLETED_AT="null"; fi
          GATE_STARTED_AT="${GATE_STARTED_AT:-$RELEASE_STARTED_AT}"
          GATE_COMPLETED_AT="${GATE_COMPLETED_AT:-$RELEASE_COMPLETED_AT}"
          if [[ -z "$GATE_RESULT" ]]; then GATE_RESULT='{}'; fi
          jq -n \
            --arg release_id "$RELEASE_RUN_ID" --argjson attempt "$RELEASE_ATTEMPT" \
            --arg release_url "$RELEASE_RUN_URL" --arg workflow "$WORKFLOW_NAME" --arg workflow_url "$WORKFLOW_URL" \
            --arg event "$SOURCE_EVENT" --arg version "$SOURCE_VERSION" --arg tag "$SOURCE_TAG" --arg sha "$SOURCE_SHA" \
            --arg release_started "$RELEASE_STARTED_AT" --arg release_completed "$RELEASE_COMPLETED_AT" \
            --arg gate_id "$GATE_RUN_ID" --arg gate_url "$GATE_URL" --arg gate_verdict "$GATE_VERDICT" \
            --argjson attempts "$GATE_ATTEMPTS" --arg gate_started "$GATE_STARTED_AT" --arg gate_completed "$GATE_COMPLETED_AT" \
            --arg gate_result "$GATE_RESULT" --arg publish_outcome "$PUBLISH_OUTCOME" \
            --arg publish_started "$PUBLISH_STARTED_AT" --arg publish_completed "$PUBLISH_COMPLETED_AT" \
            --arg terminal "$TERMINAL_VERDICT" --argjson failure "$FAILURE_JSON" \
            --arg publish_failure_stage "$PUBLISH_FAILURE_STAGE" \
            '{schema_version:1,
              release_run:{id:$release_id,attempt:$attempt,url:$release_url,workflow_name:$workflow,workflow_url:$workflow_url,started_at:$release_started,completed_at:$release_completed},
              source_event:$event,source:{version:$version,tag:$tag,sha:$sha},
              gate:({run_id:(if $gate_id == "" then null else $gate_id end),url:(if $gate_url == "" then null else $gate_url end),verdict:$gate_verdict,attempts:$attempts,started_at:$gate_started,completed_at:$gate_completed} +
                (try ($gate_result | fromjson | {ci_run_id:.run_id,ci_run_url:.run_url,head_sha:.head_sha}) catch {})),
              publish:{outcome:$publish_outcome,started_at:(if $publish_started == "null" then null else $publish_started end),completed_at:(if $publish_completed == "null" then null else $publish_completed end)},
              terminal_verdict:$terminal,failure:$failure,observer_run:null,
              stages:{release:{verdict:"created",completed_at:$release_completed},gate:{verdict:$gate_verdict,run_id:(if $gate_id == "" then null else $gate_id end)},publish:{outcome:$publish_outcome,failure_stage:$publish_failure_stage}}}' \
            > release-result-input.json
          bash scripts/ci/release-receipt.sh --input release-result-input.json --output release-result.json

      - name: Upload terminal release receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-result-${{ needs.release-please.outputs.version }}-${{ github.run_id }}
          path: release-result.json
          if-no-files-found: error
          retention-days: 90

  # HARD-02 (Phase 222 Plan 02, D-06.3): release-please auto-publish previously
  # stalled silently for ~30 minutes when gate-ci-green timed out, or failed
  # quietly on a broken publish-hex step, with no failure consumer. This
  # aggregator job opens/updates a single durable tracking Issue via the
  # shared scripts/ci/notify-failure-issue.sh (D-07) whenever a real release
  # (release_created == 'true') hits a failed/cancelled gate-ci-green or
  # publish-hex. A separate aggregator (vs inline `if: failure()` steps in
  # each job) is used because gate-ci-green's timeout `exit 1` reliably
  # yields `result: failure`, which fires this downstream reporter.
  notify-release-failure:
    name: Notify on release-please publish/gate failure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    needs: [release-please, gate-ci-green, publish-hex, record-release-result]
    if: >-
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      (needs.gate-ci-green.result == 'failure' || needs.gate-ci-green.result == 'cancelled' ||
       needs.publish-hex.result == 'failure' || needs.publish-hex.result == 'cancelled')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Open or update release-lane-rot tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: release-lane-rot
          TITLE: "release-please publish/gate failed (release-lane-rot)"
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE_CI_GREEN_RESULT: ${{ needs.gate-ci-green.result }}
          PUBLISH_HEX_RESULT: ${{ needs.publish-hex.result }}
        run: |
          set -euo pipefail
          FAILING_JOB="gate-ci-green"
          if [ "${PUBLISH_HEX_RESULT}" = "failure" ] || [ "${PUBLISH_HEX_RESULT}" = "cancelled" ]; then
            FAILING_JOB="publish-hex"
          fi
          echo "::error::release-please publish/gate failed for ${TAG_NAME:-<unknown tag>} -- opening/updating tracking issue release-lane-rot (failing job: ${FAILING_JOB})"
          BODY="release-please auto-publish did not complete for ${TAG_NAME:-<unknown tag>} (version ${VERSION:-<unknown>}).

          - Run: ${RUN_URL}
          - Failing job: ${FAILING_JOB} (gate-ci-green=${GATE_CI_GREEN_RESULT}, publish-hex=${PUBLISH_HEX_RESULT})

          This is the HARD-02 fail-loudly signal (Phase 222 Plan 02) -- release-please created the release but the CI-green gate or the Hex publish step did not finish successfully. See docs/release-runbook-v1-0.md for recovery/manual-dispatch steps. Investigate the linked run, then close this issue once resolved."
          export BODY
          bash scripts/ci/notify-failure-issue.sh
