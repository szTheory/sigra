name: Release Run Observer

run-name: release-observer-${{ github.event.workflow_run.id }}-${{ github.run_id }}-${{ github.run_attempt }}

on:
  workflow_run:
    workflows: ["Release Please", "Release Receipt Canary"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: release-run-observer-${{ github.event.workflow_run.id }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  record-cancellation:
    name: Record cancelled release or canary run
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'cancelled' && (github.event.workflow.name == 'Release Please' || github.event.workflow.name == 'Release Receipt Canary') }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Validate source run and write cancellation receipt
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PATH: ${{ github.event_path }}
        run: bash scripts/ci/release-observer.sh --event "$EVENT_PATH" --output release-cancellation.json

      - name: Upload cancellation receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.workflow.name == 'Release Receipt Canary' && format('release-canary-cancellation-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) || format('release-cancellation-{0}', github.event.workflow_run.id) }}
          path: release-cancellation.json
          if-no-files-found: error
          retention-days: 90
