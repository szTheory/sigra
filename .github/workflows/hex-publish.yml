# Optional manual Hex publish — workflow_dispatch only.
# Configure repository secret HEX_API_KEY (scoped to publish). This file intentionally
# does not run on branch pushes; use MAINTAINING.md as the source of truth for when to release.

name: Hex publish (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sigra_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache library deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new
      - name: Fetch library deps
        run: mix deps.get
      - name: Compile
        run: mix compile
      - name: Run library tests
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test
      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
