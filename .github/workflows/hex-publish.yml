# Manual recovery: publish an already-tagged (or pinned SHA) revision to Hex when
# automation did not run or needs a one-off retry. Default path is **Release Please**
# (`.github/workflows/release-please.yml`) on merge of the Release PR.
#
# Requires repository secret: HEX_API_KEY (Actions secrets).

name: Hex publish (manual recovery)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag or commit SHA that resolves to v<release_version> (e.g. v1.0.0).'
        required: true
        type: string
      release_version:
        description: 'Expected @version string in mix.exs at that ref (e.g. 1.0.0).'
        required: true
        type: string
      dry_run:
        description: 'Run mix hex.publish --dry-run instead of publishing.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hex-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sigra_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - name: Validate manual release inputs
        run: |
          set -euo pipefail
          input_ref="${{ inputs.tag }}"
          input_version="${{ inputs.release_version }}"
          expected_tag="v${input_version}"
          if [[ ! "$input_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid inputs.release_version: '$input_version'"
            exit 1
          fi
          if [[ "$input_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            if [ "$input_ref" != "$expected_tag" ]; then
              echo "Tag/version mismatch: tag=$input_ref expected=$expected_tag"
              exit 1
            fi
            echo "Accepted tag ref: $input_ref"
          elif [[ "$input_ref" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "Accepted commit SHA ref for provenance check: $input_ref"
          else
            echo "Invalid inputs.tag: '$input_ref' (must be v<release_version> or commit SHA resolving to v<release_version>)"
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify manual ref provenance
        run: |
          set -euo pipefail
          input_ref="${{ inputs.tag }}"
          input_version="${{ inputs.release_version }}"
          expected_tag="v${input_version}"

          git fetch --force --tags origin
          tag_commit="$(git rev-list -n 1 "${expected_tag}")"
          input_commit="$(git rev-parse "${input_ref}^{commit}")"

          if [ "$input_commit" != "$tag_commit" ]; then
            echo "Ref ${input_ref} does not resolve to ${expected_tag} (${tag_commit})"
            exit 1
          fi
          echo "manual ref provenance verified: ${input_ref} -> ${expected_tag} (${tag_commit})"

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache library deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      # Matches library_tests in ci.yml: InstallFixture shells out to mix phx.new.
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new 1.8.8

      - name: Verify release version in mix.exs
        run: grep -nF "@version \"${{ inputs.release_version }}\"" mix.exs

      - name: Verify release version in release-please-manifest
        run: |
          set -euo pipefail
          expected_version="${{ inputs.release_version }}"
          actual_version="$(grep -oE '"\."\s*:\s*"[^"]+"' .release-please-manifest.json | sed -E 's/.*"([^"]+)"$/\1/')"
          if [ -z "$actual_version" ]; then
            echo "Unable to read version from .release-please-manifest.json"
            exit 1
          fi
          if [ "$actual_version" != "$expected_version" ]; then
            echo "Manifest version mismatch: manifest=$actual_version expected=$expected_version"
            exit 1
          fi
          echo "manifest/version truth verified: $actual_version"

      - name: Verify docs source_ref follows version
        run: |
          grep -n 'source_ref: "v#{@version}"' mix.exs

      - name: Fetch library deps
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run library tests
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test

      - name: Check docs build cleanly
        run: mix docs --warnings-as-errors

      - name: Inspect packaged files
        run: |
          set -euo pipefail
          mix hex.build --unpack --output sigra-hex-inspect
          test -f sigra-hex-inspect/README.md
          test -f sigra-hex-inspect/CHANGELOG.md
          test -f sigra-hex-inspect/mix.exs
          test -d sigra-hex-inspect/lib
          if [ -e sigra-hex-inspect/.planning ]; then
            echo "Package contains forbidden .planning directory"
            exit 1
          fi

      - name: Skip if version already on Hex
        id: idempotency
        if: ${{ inputs.dry_run != true }}
        run: |
          if mix hex.info sigra "${{ inputs.release_version }}" 2>/dev/null | grep -q "Released:"; then
            echo "Version ${{ inputs.release_version }} of sigra already on Hex - skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry run Hex publish
        if: ${{ inputs.dry_run == true || steps.idempotency.outputs.skip != 'true' }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --dry-run --yes

      - name: Publish to Hex
        if: ${{ inputs.dry_run != true && steps.idempotency.outputs.skip != 'true' }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      - name: Verify version on Hex.pm
        if: ${{ inputs.dry_run != true }}
        env:
          VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS "https://hex.pm/api/packages/sigra/releases/${VERSION}" | grep -q "\"version\""; then
              echo "Hex.pm lists sigra ${VERSION}"
              exit 0
            fi
            echo "waiting for Hex index... (${i}/36)"
            sleep 10
          done
          echo "Timed out waiting for https://hex.pm/api/packages/sigra/releases/${VERSION}"
          exit 1

      - name: Verify HexDocs source links after publish
        if: ${{ inputs.dry_run != true }}
        run: |
          scripts/ci/release-post-publish-verify.sh \
            --package sigra \
            --version "${{ inputs.release_version }}" \
            --tag "v${{ inputs.release_version }}" \
            --evidence-file release-post-publish-evidence.json

      - name: Upload release post-publish evidence
        if: ${{ always() && inputs.dry_run != true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-post-publish-evidence-${{ inputs.release_version }}
          path: release-post-publish-evidence.json
          if-no-files-found: ignore
          retention-days: 90
