name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  library_tests:
    name: Library tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'
      - name: Cache library deps
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}
      - name: Fetch library deps
        run: mix deps.get
      - name: Run library tests
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test
      - name: Check docs build cleanly
        run: mix docs --warnings-as-errors

  example_unit_smoke:
    name: Example unit smoke (ExUnit + ConnTest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'
      - name: Cache example deps
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.4
        with:
          path: |
            test/example/deps
            test/example/_build
          key: ${{ runner.os }}-example-${{ hashFiles('test/example/mix.lock') }}
      - name: Fetch example deps
        working-directory: test/example
        run: mix deps.get
      - name: Compile example
        working-directory: test/example
        run: mix compile --warnings-as-errors
      - name: Setup database
        working-directory: test/example
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix ecto.create && mix ecto.migrate
      - name: Run smoke tests
        working-directory: test/example
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test --include example_app

  install_smoke:
    name: Install smoke (fresh phx.new + sigra.install)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'
      - name: Cache Sigra library deps
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}
      - name: Cache Hex registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.4
        with:
          path: ~/.hex
          key: ${{ runner.os }}-hex-registry-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-hex-registry-
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new
      - name: Fetch Sigra library deps
        run: mix deps.get
      - name: Run install smoke harness
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: scripts/ci/install-smoke.sh

  example_http_smoke:
    name: Example HTTP smoke (boot + curl critical routes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'
      - name: Cache example deps
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.4
        with:
          path: |
            test/example/deps
            test/example/_build
          key: ${{ runner.os }}-example-dev-${{ hashFiles('test/example/mix.lock') }}
      - name: Fetch example deps
        working-directory: test/example
        env:
          MIX_ENV: dev
        run: mix deps.get
      - name: Compile example
        working-directory: test/example
        env:
          MIX_ENV: dev
        run: mix compile --warnings-as-errors
      - name: Setup example dev DB
        working-directory: test/example
        env:
          MIX_ENV: dev
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix ecto.create && mix ecto.migrate
      - name: Boot example app in background
        working-directory: test/example
        env:
          MIX_ENV: dev
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PHX_SERVER: "true"
        run: mix phx.server &
      - name: Run HTTP smoke harness
        run: scripts/ci/http-smoke.sh

  example_playwright_smoke:
    name: Example Playwright smoke (full lifecycle)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6  # v4.0.4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'test/example/priv/playwright/package-lock.json'
      - name: Cache example deps
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.4
        with:
          path: |
            test/example/deps
            test/example/_build
          key: ${{ runner.os }}-example-dev-${{ hashFiles('test/example/mix.lock') }}
      - name: Fetch example deps
        working-directory: test/example
        env:
          MIX_ENV: dev
        run: mix deps.get
      - name: Compile example
        working-directory: test/example
        env:
          MIX_ENV: dev
        run: mix compile --warnings-as-errors
      - name: Setup example dev DB
        working-directory: test/example
        env:
          MIX_ENV: dev
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix ecto.create && mix ecto.migrate
      - name: Install Playwright deps
        working-directory: test/example/priv/playwright
        run: npm ci
      - name: Install Playwright browsers
        working-directory: test/example/priv/playwright
        run: npx playwright install --with-deps chromium
      - name: Boot example app in background
        working-directory: test/example
        env:
          MIX_ENV: dev
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PHX_SERVER: "true"
        run: mix phx.server &
      - name: Wait for app to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/ > /dev/null; then
              echo "App responding after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "FAIL: app did not respond within 30s"; exit 1
      - name: Run Playwright golden-path spec
        working-directory: test/example/priv/playwright
        env:
          CI: "true"
          SIGRA_EXAMPLE_URL: "http://localhost:4000"
        run: npx playwright test
      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: playwright-report
          path: test/example/priv/playwright/playwright-report/
          retention-days: 7
