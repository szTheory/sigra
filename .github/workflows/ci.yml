name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  library_tests:
    name: Library tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache library deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      # phx_new archive is required by test/sigra/install/golden_diff_test.exs
      # and idempotency_test.exs — both use InstallFixture.setup_tmp_app/1
      # which shells out to `mix phx.new` to scaffold a fresh Phoenix app.
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new
      - name: Fetch library deps
        run: mix deps.get
      - name: Run library tests
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test
      - name: Check docs build cleanly
        run: mix docs --warnings-as-errors

  example_unit_smoke:
    name: Example unit smoke (ExUnit + ConnTest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache example deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            test/example/deps
            test/example/_build
          key: ${{ runner.os }}-example-${{ hashFiles('test/example/mix.lock', 'test/example/config/**', 'test/example/lib/**/*.ex', 'lib/**/*.ex', 'mix.exs') }}
      - name: Fetch example deps
        working-directory: test/example
        run: mix deps.get
      - name: Compile example
        working-directory: test/example
        run: mix compile --warnings-as-errors
      - name: Setup database
        working-directory: test/example
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix ecto.create && mix ecto.migrate
      - name: Run smoke tests
        working-directory: test/example
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test --include example_app

  install_smoke:
    name: Install smoke (fresh phx.new + sigra.install)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache Sigra library deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}
      - name: Cache Hex registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.hex
          key: ${{ runner.os }}-hex-registry-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-hex-registry-
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new
      - name: Fetch Sigra library deps
        run: mix deps.get
      - name: Run install smoke harness
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: scripts/ci/install-smoke.sh

  passkeys_manual_fallback_smoke:
