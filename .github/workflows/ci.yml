  install_matrix:
    name: Install matrix (flag combinations)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      # tmp_app runs mix test + phx.server with Sigra-generated Cloak.Vault (decode_env!("CLOAK_KEY")).
      CLOAK_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    strategy:
      fail-fast: false
      matrix:
        flags:
          - ""
          - "--no-passkeys"
          - "--no-organizations"
          - "--no-organizations --no-passkeys"
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        id: setup
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache Sigra library deps
        id: install_matrix_deps_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-test-${{ hashFiles('mix.lock') }}-v1
          restore-keys: ${{ runner.os }}-library-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-test-
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new 1.8.7
      - name: Fetch Sigra library deps
        run: mix deps.get
      - name: Scaffold fresh Phoenix app
        # --no-mailer removed: sigra.install generates accounts/mailer.ex
        # which `use Swoosh.Mailer`; skipping the mailer scaffold drops
        # Swoosh from the tmp app's deps and breaks `mix compile` with
        # `module Swoosh.Mailer is not loaded`. scripts/ci/install-smoke.sh
        # already scaffolds without --no-mailer for the same reason.
        run: mix phx.new tmp_app --no-assets --no-install
      - name: Patch tmp app mix.exs with sigra path dep
        working-directory: tmp_app
        run: |
          # Mirrors InstallFixture.patch_mix_exs_with_path_dep! — insert
          # `{:sigra, path: "..", override: true}` as the first entry of the
          # deps/0 list. Perl -0777 for multiline match on `defp deps do\n    [`.
          perl -i -0777 -pe 's/defp deps do\s*\n\s*\[/defp deps do\n    [\n      {:sigra, path: "..", override: true},/' mix.exs
          grep -q "{:sigra, path:" mix.exs || { echo "failed to patch mix.exs"; exit 1; }
      - name: Fetch tmp app deps
        working-directory: tmp_app
        env:
          MIX_ENV: test
        # `phx.new --no-install` skips deps fetch; mix refuses to run any
        # task (including sigra.install) until deps are resolved. Must
        # run before the install step. Mirrors install-smoke.sh:54.
        run: mix deps.get
      - name: Run sigra.install with matrix flags
        working-directory: tmp_app
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          # WR-02: pipe matrix.flags through an env var instead of direct
          # ${{ }} expansion into the shell string. Today `matrix.flags`
          # comes from the repo itself (safe), but env-var-indirection is
          # the pattern GitHub recommends because it prevents a future
          # maintainer from unknowingly inheriting command-injection if
          # the matrix value ever gets sourced from `github.event.*`.
          MATRIX_FLAGS: ${{ matrix.flags }}
        run: |
          # MATRIX_FLAGS is an intentional space-separated list of install flags;
          # word-splitting is desired.
          # shellcheck disable=SC2086
          mix sigra.install Accounts User users $MATRIX_FLAGS --yes
      - name: Compile + migrate + test
        working-directory: tmp_app
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix ecto.create
          mix ecto.migrate
          mix test
      - name: Boot app and verify root responds
        working-directory: tmp_app
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: |
          PHX_SERVER=true mix phx.server > /tmp/install-matrix-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/ > /dev/null; then
              echo "tmp_app responded after ${i}s"
              exit 0
            fi

            if [[ "${i}" -eq 30 ]]; then
              echo "FAIL: tmp_app did not boot within 30 seconds"
              cat /tmp/install-matrix-server.log
              exit 1
            fi

            sleep 1
          done

