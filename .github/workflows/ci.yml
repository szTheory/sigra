name: Phase 255.1 cache lookup probe 02

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-2551-cache-probe-02-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  source-cache-observation:
    name: Fixed source cache observation (${{ matrix.role }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: control
            source_sha: d3a873538e6924def807f045342d603e7c819cdc
          - role: candidate
            source_sha: f0f0bd7d8b2ca494726396092c4774c2e78db7dd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.source_sha }}
          persist-credentials: false

      - name: Record fixed source, workspace, and runner identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ matrix.source_sha }}" ]]
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'tree_sha=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          printf 'workspace=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          printf 'runner_os=%s\n' "$RUNNER_OS" >> "$GITHUB_OUTPUT"
          printf 'runner_arch=%s\n' "$RUNNER_ARCH" >> "$GITHUB_OUTPUT"
          printf 'image_os=%s\n' "${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
          printf 'image_version=%s\n' "${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          printf 'tool_versions_sha256=%s\n' "$(sha256sum .tool-versions | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'mix_lock_sha256=%s\n' "$(sha256sum mix.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'example_mix_lock_sha256=%s\n' "$(sha256sum test/example/mix.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'playwright_lock_sha256=%s\n' "$(sha256sum test/example/priv/playwright/package-lock.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'configured_otp_version=%s\n' "$(awk '$1 == \"erlang\" { print $2; exit }' .tool-versions)" >> "$GITHUB_OUTPUT"
          printf 'configured_elixir_version=%s\n' "$(awk '$1 == \"elixir\" { print $2; exit }' .tool-versions)" >> "$GITHUB_OUTPUT"
          printf 'runtime_key_status=unproved\n' >> "$GITHUB_OUTPUT"
          printf 'otp_version=\n' >> "$GITHUB_OUTPUT"
          printf 'elixir_version=\n' >> "$GITHUB_OUTPUT"
          printf 'os_release_sha256=%s\n' "$(sha256sum /etc/os-release | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Lookup library dependency cache
        id: library_deps
        if: steps.identity.outputs.runtime_key_status == 'observed'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-otp${{ steps.identity.outputs.otp_version }}-elixir${{ steps.identity.outputs.elixir_version }}-test-v2-${{ hashFiles('mix.lock') }}
          lookup-only: true

      - name: Lookup admin behavior dependency cache
        id: admin_behavior_deps
        if: steps.identity.outputs.runtime_key_status == 'observed'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            test/example/deps
            test/example/_build
          key: ${{ runner.os }}-example-dev-port4001-otp${{ steps.identity.outputs.otp_version }}-elixir${{ steps.identity.outputs.elixir_version }}-dev-${{ hashFiles('test/example/mix.lock', 'test/example/config/**', 'test/example/lib/**/*.ex', 'lib/**/*.ex', 'mix.exs') }}-v1
          lookup-only: true

      - name: Lookup admin checkpoints dependency cache
        id: admin_checkpoints_deps
        if: steps.identity.outputs.runtime_key_status == 'observed'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            test/example/deps
            test/example/_build
          key: ${{ runner.os }}-example-dev-port4002-otp${{ steps.identity.outputs.otp_version }}-elixir${{ steps.identity.outputs.elixir_version }}-dev-${{ hashFiles('test/example/mix.lock', 'test/example/config/**', 'test/example/lib/**/*.ex', 'lib/**/*.ex', 'mix.exs') }}-v1
          lookup-only: true

      - name: Lookup design gallery dependency cache
        id: design_gallery_deps
        if: steps.identity.outputs.runtime_key_status == 'observed'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            test/example/deps
            test/example/_build
          key: ${{ runner.os }}-example-dev-port4003-otp${{ steps.identity.outputs.otp_version }}-elixir${{ steps.identity.outputs.elixir_version }}-dev-${{ hashFiles('test/example/mix.lock', 'test/example/config/**', 'test/example/lib/**/*.ex', 'lib/**/*.ex', 'mix.exs') }}-v1
          lookup-only: true

      - name: Lookup non-admin smoke dependency cache
        id: non_admin_deps
        if: steps.identity.outputs.runtime_key_status == 'observed'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            test/example/deps
            test/example/_build
          key: ${{ runner.os }}-example-dev-port4004-otp${{ steps.identity.outputs.otp_version }}-elixir${{ steps.identity.outputs.elixir_version }}-dev-${{ hashFiles('test/example/mix.lock', 'test/example/config/**', 'test/example/lib/**/*.ex', 'lib/**/*.ex', 'mix.exs') }}-v1
          lookup-only: true

      - name: Lookup demo showcase dependency cache
        id: demo_showcase_deps
        if: steps.identity.outputs.runtime_key_status == 'observed'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            test/example/deps
            test/example/_build
          key: ${{ runner.os }}-example-dev-port4005-otp${{ steps.identity.outputs.otp_version }}-elixir${{ steps.identity.outputs.elixir_version }}-dev-${{ hashFiles('test/example/mix.lock', 'test/example/config/**', 'test/example/lib/**/*.ex', 'lib/**/*.ex', 'mix.exs') }}-v1
          lookup-only: true

      - name: Lookup chromium browser cache for admin behavior
        id: admin_behavior_browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.59.1-v3
          lookup-only: true

      - name: Lookup chromium webkit cache for admin checkpoints
        id: admin_checkpoints_browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-webkit-1.59.1-v3
          lookup-only: true

      - name: Lookup chromium webkit cache for design gallery
        id: design_gallery_browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-webkit-1.59.1-v3
          lookup-only: true

      - name: Lookup chromium webkit cache for non-admin smoke
        id: non_admin_browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-webkit-1.59.1-v3
          lookup-only: true

      - name: Lookup chromium browser cache for demo showcase
        id: demo_showcase_browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.59.1-v3
          lookup-only: true

      - name: Record lookup outcomes
        if: always()
        env:
          ROLE: ${{ matrix.role }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          TREE_SHA: ${{ steps.identity.outputs.tree_sha }}
          WORKSPACE: ${{ steps.identity.outputs.workspace }}
          RUNNER_OS: ${{ steps.identity.outputs.runner_os }}
          RUNNER_ARCH: ${{ steps.identity.outputs.runner_arch }}
          IMAGE_OS: ${{ steps.identity.outputs.image_os }}
          IMAGE_VERSION: ${{ steps.identity.outputs.image_version }}
          TOOL_VERSIONS_SHA256: ${{ steps.identity.outputs.tool_versions_sha256 }}
          CONFIGURED_OTP_VERSION: ${{ steps.identity.outputs.configured_otp_version }}
          CONFIGURED_ELIXIR_VERSION: ${{ steps.identity.outputs.configured_elixir_version }}
          RUNTIME_KEY_STATUS: ${{ steps.identity.outputs.runtime_key_status }}
          LIBRARY_HASH_FILES: ${{ hashFiles('mix.lock') }}
          EXAMPLE_HASH_FILES: ${{ hashFiles('test/example/mix.lock', 'test/example/config/**', 'test/example/lib/**/*.ex', 'lib/**/*.ex', 'mix.exs') }}
          MIX_LOCK_SHA256: ${{ steps.identity.outputs.mix_lock_sha256 }}
          EXAMPLE_MIX_LOCK_SHA256: ${{ steps.identity.outputs.example_mix_lock_sha256 }}
          PLAYWRIGHT_LOCK_SHA256: ${{ steps.identity.outputs.playwright_lock_sha256 }}
          LIBRARY_CACHE_HIT: ${{ steps.library_deps.outputs.cache-hit }}
          LIBRARY_CACHE_PRIMARY_KEY: ${{ steps.library_deps.outputs.cache-primary-key }}
          LIBRARY_CACHE_MATCHED_KEY: ${{ steps.library_deps.outputs.cache-matched-key }}
          ADMIN_BEHAVIOR_DEPS_HIT: ${{ steps.admin_behavior_deps.outputs.cache-hit }}
          ADMIN_BEHAVIOR_DEPS_PRIMARY_KEY: ${{ steps.admin_behavior_deps.outputs.cache-primary-key }}
          ADMIN_BEHAVIOR_DEPS_MATCHED_KEY: ${{ steps.admin_behavior_deps.outputs.cache-matched-key }}
          ADMIN_CHECKPOINTS_DEPS_HIT: ${{ steps.admin_checkpoints_deps.outputs.cache-hit }}
          ADMIN_CHECKPOINTS_DEPS_PRIMARY_KEY: ${{ steps.admin_checkpoints_deps.outputs.cache-primary-key }}
          ADMIN_CHECKPOINTS_DEPS_MATCHED_KEY: ${{ steps.admin_checkpoints_deps.outputs.cache-matched-key }}
          DESIGN_GALLERY_DEPS_HIT: ${{ steps.design_gallery_deps.outputs.cache-hit }}
          DESIGN_GALLERY_DEPS_PRIMARY_KEY: ${{ steps.design_gallery_deps.outputs.cache-primary-key }}
          DESIGN_GALLERY_DEPS_MATCHED_KEY: ${{ steps.design_gallery_deps.outputs.cache-matched-key }}
          NON_ADMIN_DEPS_HIT: ${{ steps.non_admin_deps.outputs.cache-hit }}
          NON_ADMIN_DEPS_PRIMARY_KEY: ${{ steps.non_admin_deps.outputs.cache-primary-key }}
          NON_ADMIN_DEPS_MATCHED_KEY: ${{ steps.non_admin_deps.outputs.cache-matched-key }}
          DEMO_SHOWCASE_DEPS_HIT: ${{ steps.demo_showcase_deps.outputs.cache-hit }}
          DEMO_SHOWCASE_DEPS_PRIMARY_KEY: ${{ steps.demo_showcase_deps.outputs.cache-primary-key }}
          DEMO_SHOWCASE_DEPS_MATCHED_KEY: ${{ steps.demo_showcase_deps.outputs.cache-matched-key }}
          ADMIN_BEHAVIOR_BROWSER_HIT: ${{ steps.admin_behavior_browser.outputs.cache-hit }}
          ADMIN_BEHAVIOR_BROWSER_PRIMARY_KEY: ${{ steps.admin_behavior_browser.outputs.cache-primary-key }}
          ADMIN_BEHAVIOR_BROWSER_MATCHED_KEY: ${{ steps.admin_behavior_browser.outputs.cache-matched-key }}
          ADMIN_CHECKPOINTS_BROWSER_HIT: ${{ steps.admin_checkpoints_browser.outputs.cache-hit }}
          ADMIN_CHECKPOINTS_BROWSER_PRIMARY_KEY: ${{ steps.admin_checkpoints_browser.outputs.cache-primary-key }}
          ADMIN_CHECKPOINTS_BROWSER_MATCHED_KEY: ${{ steps.admin_checkpoints_browser.outputs.cache-matched-key }}
          DESIGN_GALLERY_BROWSER_HIT: ${{ steps.design_gallery_browser.outputs.cache-hit }}
          DESIGN_GALLERY_BROWSER_PRIMARY_KEY: ${{ steps.design_gallery_browser.outputs.cache-primary-key }}
          DESIGN_GALLERY_BROWSER_MATCHED_KEY: ${{ steps.design_gallery_browser.outputs.cache-matched-key }}
          NON_ADMIN_BROWSER_HIT: ${{ steps.non_admin_browser.outputs.cache-hit }}
          NON_ADMIN_BROWSER_PRIMARY_KEY: ${{ steps.non_admin_browser.outputs.cache-primary-key }}
          NON_ADMIN_BROWSER_MATCHED_KEY: ${{ steps.non_admin_browser.outputs.cache-matched-key }}
          DEMO_SHOWCASE_BROWSER_HIT: ${{ steps.demo_showcase_browser.outputs.cache-hit }}
          DEMO_SHOWCASE_BROWSER_PRIMARY_KEY: ${{ steps.demo_showcase_browser.outputs.cache-primary-key }}
          DEMO_SHOWCASE_BROWSER_MATCHED_KEY: ${{ steps.demo_showcase_browser.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/probe"
          python3 - <<'PY'
          import glob, hashlib, json, os
          from pathlib import Path
          cache_steps = {
              'library_tests_shard:dependencies': 'LIBRARY_CACHE',
              'admin_behavior:dependencies': 'ADMIN_BEHAVIOR_DEPS',
              'admin_checkpoints:dependencies': 'ADMIN_CHECKPOINTS_DEPS',
              'design_gallery:dependencies': 'DESIGN_GALLERY_DEPS',
              'non_admin_smoke:dependencies': 'NON_ADMIN_DEPS',
              'demo_showcase:dependencies': 'DEMO_SHOWCASE_DEPS',
              'admin_behavior:browser_binaries': 'ADMIN_BEHAVIOR_BROWSER',
              'admin_checkpoints:browser_binaries': 'ADMIN_CHECKPOINTS_BROWSER',
              'design_gallery:browser_binaries': 'DESIGN_GALLERY_BROWSER',
              'non_admin_smoke:browser_binaries': 'NON_ADMIN_BROWSER',
              'demo_showcase:browser_binaries': 'DEMO_SHOWCASE_BROWSER',
          }
          payload = {key.lower(): os.environ.get(key) for key in
              ('ROLE', 'SOURCE_SHA', 'TREE_SHA', 'WORKSPACE', 'RUNNER_OS', 'RUNNER_ARCH',
               'IMAGE_OS', 'IMAGE_VERSION', 'TOOL_VERSIONS_SHA256', 'CONFIGURED_OTP_VERSION',
               'CONFIGURED_ELIXIR_VERSION', 'MIX_LOCK_SHA256', 'EXAMPLE_MIX_LOCK_SHA256',
               'PLAYWRIGHT_LOCK_SHA256', 'RUNTIME_KEY_STATUS', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')}
          payload['runtime_key_status'] = 'unproved'
          payload['runtime_limitation'] = 'Configured pins are not observed setup-beam outputs; six dependency lookups are not attempted.'
          payload['hashfiles_inputs'] = {}
          for kind, patterns, expression in (
              ('library', ('mix.lock',), "hashFiles('mix.lock')"),
              ('example', ('test/example/mix.lock', 'test/example/config/**', 'test/example/lib/**/*.ex', 'lib/**/*.ex', 'mix.exs'),
               "hashFiles('test/example/mix.lock', 'test/example/config/**', 'test/example/lib/**/*.ex', 'lib/**/*.ex', 'mix.exs')")):
              paths = sorted({path for pattern in patterns for path in glob.glob(pattern, recursive=True, include_hidden=True)
                              if Path(path).is_file()})
              if any(Path(path).is_symlink() for path in paths):
                  raise SystemExit('Symbolic hashFiles input is not allowed in the sealed lookup probe')
              files = [{'path': path, 'sha256': hashlib.sha256(Path(path).read_bytes()).hexdigest()} for path in paths]
              combined = hashlib.sha256(b''.join(bytes.fromhex(row['sha256']) for row in files)).hexdigest() if files else ''
              payload['hashfiles_inputs'][kind] = {'expression': expression, 'files': files,
                  'manifest_sha256': hashlib.sha256(json.dumps(files, sort_keys=True, separators=(',', ':')).encode()).hexdigest(),
                  'computed_hash': combined, 'runner_hashfiles': os.environ.get(kind.upper() + '_HASH_FILES')}
          payload['cache_components'] = {}
          for name, step in cache_steps.items():
              owner, component = name.split(':')
              paths = (['deps', '_build'] if owner == 'library_tests_shard' else ['test/example/deps', 'test/example/_build']) if component == 'dependencies' else ['~/.cache/ms-playwright']
              hit, key = os.environ.get(step + '_HIT'), os.environ.get(step + '_PRIMARY_KEY')
              payload['cache_components'][name] = {'cache_hit': hit, 'primary_key': key,
                  'matched_key': os.environ.get(step + '_MATCHED_KEY'), 'version': None,
                  'version_status': 'unproved_restore_action_does_not_report_cache_version',
                  'lookup_status': ('not_attempted_runtime_unknown' if component == 'dependencies' and not key else 'observed'),
                  'cache_paths': paths, 'lookup_only': True, 'cache_write': False, 'cache_download': False}
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'probe', 'cache-observation.json'), 'w') as out:
              json.dump(payload, out, sort_keys=True, indent=2)
              out.write('\n')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cache-probe-02-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/probe/cache-observation.json
          if-no-files-found: error
          retention-days: 7
