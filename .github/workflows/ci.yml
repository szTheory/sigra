name: CI

on:
  # Release-ref evidence path: manually dispatch this workflow from a v* tag
  # (`gh workflow run "CI" --ref v1.32.0` or Actions UI) to rerun canonical gates.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for GITHUB_TOKEN: CI only reads the repo and
# uploads artifacts (via actions/upload-artifact, which does not require
# contents: write). Any job that needs additional scopes must override
# `permissions:` at the job level.
permissions:
  contents: read

# Note: Repository secret HEX_API_KEY (Hex.pm) is not read by this workflow unless
# you add an explicit publish job with `env: HEX_API_KEY: ${{ secrets.HEX_API_KEY }}`.
# Library/install failures are unrelated to that secret.

jobs:
  release_ref_guard:
    name: Release ref guard
    runs-on: ubuntu-latest
    steps:
      - name: Require release tag ref for manual release evidence
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Non-manual CI run; release-ref guard not applicable."
            exit 0
          fi
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *)
              echo "Manual CI release-evidence runs must use refs/tags/v*; got ${GITHUB_REF}"
              echo "Run with: gh workflow run \"CI\" --ref v1.32.0"
              exit 1
              ;;
          esac

  milestone_verification_gate:
    name: Milestone VERIFICATION.md gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Run milestone verification gate
        run: bash scripts/ci/milestone-verification-gate.sh

  installer_milestone_audit:
    name: Installer milestone audit (INT-01..03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Detect installer-related changes (PRs only)
        id: detect
        shell: bash
        # Phase 51: include GA-adjacent lib surfaces (MFA/OAuth/account/passkeys) — see MAINTAINING.md §Installer golden CI contract.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^priv/templates/sigra\.install/|^lib/sigra/install/|^lib/sigra/mfa(\.ex|/)|^lib/sigra/oauth(\.ex|/)|^lib/sigra/account(\.ex|/)|^lib/sigra/passkeys(\.ex|/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run installer milestone audit
        if: steps.detect.outputs.run == 'true'
        run: bash scripts/ci/installer-milestone-audit.sh

  install_golden_contract:
    name: Install golden + idempotency contract (subprocess harness)
    runs-on: ubuntu-latest
    needs: release_ref_guard
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sigra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Detect installer-related changes (PRs only)
        id: detect
        shell: bash
        # Phase 51: include GA-adjacent lib surfaces (MFA/OAuth/account/passkeys) — see MAINTAINING.md §Installer golden CI contract.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^priv/templates/sigra\.install/|^lib/sigra/install/|^lib/sigra/mfa(\.ex|/)|^lib/sigra/oauth(\.ex|/)|^lib/sigra/account(\.ex|/)|^lib/sigra/passkeys(\.ex|/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        if: steps.detect.outputs.run == 'true'
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache library deps
        if: steps.detect.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}
      - name: Install Hex + Rebar
        if: steps.detect.outputs.run == 'true'
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install phx_new archive
        if: steps.detect.outputs.run == 'true'
        run: mix archive.install --force hex phx_new
      - name: Fetch library deps
        if: steps.detect.outputs.run == 'true'
        run: mix deps.get
      - name: Run install golden + idempotency tests
        if: steps.detect.outputs.run == 'true'
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test test/sigra/install/golden_diff_test.exs test/sigra/install/idempotency_test.exs

  library_tests:
    name: Library tests
    runs-on: ubuntu-latest
    needs: release_ref_guard
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          # Sigra.Test.PostgresRepo and admin/audit integration tests expect this DB to exist.
          POSTGRES_DB: sigra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache library deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      # phx_new archive is required by test/sigra/install/golden_diff_test.exs
      # and idempotency_test.exs — both use InstallFixture.setup_tmp_app/1
      # which shells out to `mix phx.new` to scaffold a fresh Phoenix app.
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new
      - name: Fetch library deps
        run: mix deps.get
      - name: Run library tests
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test
      - name: Check docs build cleanly
        run: mix docs --warnings-as-errors

  library_tests_dep_off:
    name: Library tests (dep-off — Threadline absent)
    runs-on: ubuntu-latest
    needs: release_ref_guard
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          # Sigra.Test.PostgresRepo and admin/audit integration tests expect this DB to exist.
          POSTGRES_DB: sigra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache library deps (dep-off lane)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            deps
            _build
          key: "${{ runner.os }}-library-dep-off-${{ hashFiles('mix.lock') }}"
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new
      - name: Fetch library deps
        run: mix deps.get
      - name: Remove :threadline from dep graph (dep-off lane)
        run: |
          mix deps.unlock threadline
          mix deps.clean threadline --build
      - name: Compile without Threadline (proves Code.ensure_loaded? wraps work)
        env:
          MIX_ENV: test
        run: mix compile --warnings-as-errors --no-deps-check
      - name: Run library tests (Threadline absent)
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test --exclude requires_threadline --no-deps-check

  example_unit_smoke:
    name: Example unit smoke (ExUnit + ConnTest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache example deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            test/example/deps
            test/example/_build
          key: ${{ runner.os }}-example-${{ hashFiles('test/example/mix.lock', 'test/example/config/**', 'test/example/lib/**/*.ex', 'lib/**/*.ex', 'mix.exs') }}
      - name: Fetch example deps
        working-directory: test/example
        run: mix deps.get
      - name: Compile example
        working-directory: test/example
        run: mix compile --warnings-as-errors
      - name: Setup database
        working-directory: test/example
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix ecto.create && mix ecto.migrate
      - name: Run smoke tests
        working-directory: test/example
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test --include example_app

  install_smoke:
    # Also closes SEED-3 / UAT-01 greenfield: `mix sigra.gen.oauth` + path/migration/router
    # checks (see scripts/ci/install-smoke.sh and docs/uat-ci-coverage.md).
    name: Install smoke (fresh phx.new + sigra.install)
    runs-on: ubuntu-latest
    needs: release_ref_guard
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache Sigra library deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}
      - name: Cache Hex registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.hex
          key: ${{ runner.os }}-hex-registry-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-hex-registry-
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new
      - name: Fetch Sigra library deps
        run: mix deps.get
      - name: Run install smoke harness
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          GITHUB_WORKSPACE: ${{ github.workspace }}
          # Fresh tmp_app includes Cloak.Vault; compile/boot needs a dummy key (same as admin-acceptance-smoke.sh).
          CLOAK_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: scripts/ci/install-smoke.sh

  upgrade_smoke:
    name: Upgrade smoke (published source series -> local candidate)
    runs-on: ubuntu-latest
    needs: release_ref_guard
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache Sigra library deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}
      - name: Cache Hex registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.hex
          key: ${{ runner.os }}-hex-registry-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-hex-registry-
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new
      - name: Fetch Sigra library deps
        run: mix deps.get
      - name: Run upgrade smoke harness
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          GITHUB_WORKSPACE: ${{ github.workspace }}
          CLOAK_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: scripts/ci/upgrade-smoke.sh

  passkeys_manual_fallback_smoke:
    name: Passkeys manual fallback smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache Sigra library deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}
      - name: Cache Hex registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.hex
          key: ${{ runner.os }}-hex-registry-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-hex-registry-
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new
      - name: Fetch Sigra library deps
        run: mix deps.get
      - name: Run passkeys manual fallback smoke harness
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: scripts/ci/passkeys-manual-fallback-smoke.sh

  install_matrix:
    name: Install matrix (flag combinations)
    runs-on: ubuntu-latest
    env:
      # tmp_app runs mix test + phx.server with Sigra-generated Cloak.Vault (decode_env!("CLOAK_KEY")).
      CLOAK_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    strategy:
      fail-fast: false
      matrix:
        flags:
          - ""
          - "--no-passkeys"
          - "--no-organizations"
          - "--no-organizations --no-passkeys"
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache Sigra library deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new
      - name: Fetch Sigra library deps
        run: mix deps.get
      - name: Scaffold fresh Phoenix app
        # --no-mailer removed: sigra.install generates accounts/mailer.ex
        # which `use Swoosh.Mailer`; skipping the mailer scaffold drops
        # Swoosh from the tmp app's deps and breaks `mix compile` with
        # `module Swoosh.Mailer is not loaded`. scripts/ci/install-smoke.sh
        # already scaffolds without --no-mailer for the same reason.
        run: mix phx.new tmp_app --no-assets --no-install
      - name: Patch tmp app mix.exs with sigra path dep
        working-directory: tmp_app
        run: |
          # Mirrors InstallFixture.patch_mix_exs_with_path_dep! — insert
          # `{:sigra, path: "..", override: true}` as the first entry of the
          # deps/0 list. Perl -0777 for multiline match on `defp deps do\n    [`.
          perl -i -0777 -pe 's/defp deps do\s*\n\s*\[/defp deps do\n    [\n      {:sigra, path: "..", override: true},/' mix.exs
          grep -q "{:sigra, path:" mix.exs || { echo "failed to patch mix.exs"; exit 1; }
      - name: Fetch tmp app deps
        working-directory: tmp_app
        env:
          MIX_ENV: test
        # `phx.new --no-install` skips deps fetch; mix refuses to run any
        # task (including sigra.install) until deps are resolved. Must
        # run before the install step. Mirrors install-smoke.sh:54.
        run: mix deps.get
      - name: Run sigra.install with matrix flags
        working-directory: tmp_app
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          # WR-02: pipe matrix.flags through an env var instead of direct
          # ${{ }} expansion into the shell string. Today `matrix.flags`
          # comes from the repo itself (safe), but env-var-indirection is
          # the pattern GitHub recommends because it prevents a future
          # maintainer from unknowingly inheriting command-injection if
          # the matrix value ever gets sourced from `github.event.*`.
          MATRIX_FLAGS: ${{ matrix.flags }}
        run: |
          # MATRIX_FLAGS is an intentional space-separated list of install flags;
          # word-splitting is desired.
          # shellcheck disable=SC2086
          mix sigra.install Accounts User users $MATRIX_FLAGS --yes
      - name: Compile + migrate + test
        working-directory: tmp_app
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix ecto.create
          mix ecto.migrate
          mix test
      - name: Boot app and verify root responds
        working-directory: tmp_app
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: |
          PHX_SERVER=true mix phx.server > /tmp/install-matrix-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/ > /dev/null; then
              echo "tmp_app responded after ${i}s"
              exit 0
            fi

            if [[ "${i}" -eq 30 ]]; then
              echo "FAIL: tmp_app did not boot within 30 seconds"
              cat /tmp/install-matrix-server.log
              exit 1
            fi

            sleep 1
          done

  passkeys_opt_out_smoke:
    name: Passkeys opt-out smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
