name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  library_tests:
    name: Library tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache library deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      # phx_new archive is required by test/sigra/install/golden_diff_test.exs
      # and idempotency_test.exs — both use InstallFixture.setup_tmp_app/1
      # which shells out to `mix phx.new` to scaffold a fresh Phoenix app.
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new
      - name: Fetch library deps
        run: mix deps.get
      - name: Run library tests
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test
      - name: Check docs build cleanly
        run: mix docs --warnings-as-errors

  example_unit_smoke:
    name: Example unit smoke (ExUnit + ConnTest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache example deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            test/example/deps
            test/example/_build
          key: ${{ runner.os }}-example-${{ hashFiles('test/example/mix.lock', 'test/example/config/**', 'test/example/lib/**/*.ex', 'lib/**/*.ex', 'mix.exs') }}
      - name: Fetch example deps
        working-directory: test/example
        run: mix deps.get
      - name: Compile example
        working-directory: test/example
        run: mix compile --warnings-as-errors
      - name: Setup database
        working-directory: test/example
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix ecto.create && mix ecto.migrate
      - name: Run smoke tests
        working-directory: test/example
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test --include example_app

  install_smoke:
    name: Install smoke (fresh phx.new + sigra.install)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache Sigra library deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}
      - name: Cache Hex registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.hex
          key: ${{ runner.os }}-hex-registry-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-hex-registry-
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new
      - name: Fetch Sigra library deps
        run: mix deps.get
      - name: Run install smoke harness
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: scripts/ci/install-smoke.sh

  install_matrix:
    name: Install matrix (flag combinations)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Extensible — Phase 19+ will append:
        #   - "--no-passkeys"
        #   - "--no-organizations --no-passkeys"
        flags:
          - ""
          - "--no-organizations"
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache Sigra library deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new
      - name: Fetch Sigra library deps
        run: mix deps.get
      - name: Scaffold fresh Phoenix app
        # --no-mailer removed: sigra.install generates accounts/mailer.ex
        # which `use Swoosh.Mailer`; skipping the mailer scaffold drops
        # Swoosh from the tmp app's deps and breaks `mix compile` with
        # `module Swoosh.Mailer is not loaded`. scripts/ci/install-smoke.sh
        # already scaffolds without --no-mailer for the same reason.
        run: mix phx.new tmp_app --no-assets --no-install
      - name: Patch tmp app mix.exs with sigra path dep
        working-directory: tmp_app
        run: |
          # Mirrors InstallFixture.patch_mix_exs_with_path_dep! — insert
          # `{:sigra, path: "..", override: true}` as the first entry of the
          # deps/0 list. Perl -0777 for multiline match on `defp deps do\n    [`.
          perl -i -0777 -pe 's/defp deps do\s*\n\s*\[/defp deps do\n    [\n      {:sigra, path: "..", override: true},/' mix.exs
          grep -q "{:sigra, path:" mix.exs || { echo "failed to patch mix.exs"; exit 1; }
      - name: Fetch tmp app deps
        working-directory: tmp_app
        env:
          MIX_ENV: test
        # `phx.new --no-install` skips deps fetch; mix refuses to run any
        # task (including sigra.install) until deps are resolved. Must
        # run before the install step. Mirrors install-smoke.sh:54.
        run: mix deps.get
      - name: Run sigra.install with matrix flags
        working-directory: tmp_app
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix sigra.install Accounts User users ${{ matrix.flags }} --yes
      - name: Compile + migrate + test
        working-directory: tmp_app
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix ecto.create
          mix ecto.migrate
          mix test

  example_http_smoke:
    name: Example HTTP smoke (boot + curl critical routes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache example deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            test/example/deps
            test/example/_build
          key: ${{ runner.os }}-example-dev-${{ hashFiles('test/example/mix.lock', 'test/example/config/**', 'test/example/lib/**/*.ex', 'lib/**/*.ex', 'mix.exs') }}
      - name: Fetch example deps
        working-directory: test/example
        env:
          MIX_ENV: dev
        run: mix deps.get
      - name: Compile example
        working-directory: test/example
        env:
          MIX_ENV: dev
        run: mix compile --warnings-as-errors
      - name: Setup example dev DB
        working-directory: test/example
        env:
          MIX_ENV: dev
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix ecto.create && mix ecto.migrate
      - name: Boot example app in background
        working-directory: test/example
        env:
          MIX_ENV: dev
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PHX_SERVER: "true"
        run: mix phx.server &
      - name: Run HTTP smoke harness
        run: scripts/ci/http-smoke.sh

  example_playwright_smoke:
    name: Example Playwright smoke (full lifecycle)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6  # v4.0.4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'test/example/priv/playwright/package-lock.json'
      - name: Cache example deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            test/example/deps
            test/example/_build
          key: ${{ runner.os }}-example-dev-${{ hashFiles('test/example/mix.lock', 'test/example/config/**', 'test/example/lib/**/*.ex', 'lib/**/*.ex', 'mix.exs') }}
      - name: Fetch example deps
        working-directory: test/example
        env:
          MIX_ENV: dev
        run: mix deps.get
      - name: Compile example
        working-directory: test/example
        env:
          MIX_ENV: dev
        run: mix compile --warnings-as-errors
      - name: Setup example dev DB
        working-directory: test/example
        env:
          MIX_ENV: dev
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix ecto.create && mix ecto.migrate
      - name: Install Playwright deps
        working-directory: test/example/priv/playwright
        run: npm ci
      - name: Install Playwright browsers
        working-directory: test/example/priv/playwright
        run: npx playwright install --with-deps chromium
      - name: Boot example app in background
        working-directory: test/example
        env:
          MIX_ENV: dev
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PHX_SERVER: "true"
        run: mix phx.server &
      - name: Wait for app and warm up LiveView routes
        run: |
          # Wait for root.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/ > /dev/null; then
              echo "App responding after ${i}s"
              break
            fi
            sleep 1
          done
          # Warm up the routes the test will hit. With `plug_init_mode:
          # :runtime` in dev, first-touch of each route pays compile-on-
          # demand latency — without this, Playwright's first toHaveURL
          # check on /users/register races the first LiveView compile.
          for path in /users/register /users/log_in /users/confirm /dev/mailbox /users/sessions /users/sudo /users/settings/mfa; do
            curl -sf -o /dev/null "http://localhost:4000${path}" \
              && echo "warmed ${path}" \
              || echo "warmup miss ${path} (non-fatal)"
          done
      - name: Run Playwright golden-path spec
        working-directory: test/example/priv/playwright
        env:
          CI: "true"
          SIGRA_EXAMPLE_URL: "http://localhost:4000"
        run: npx playwright test
      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: playwright-report
          path: test/example/priv/playwright/playwright-report/
          retention-days: 7
