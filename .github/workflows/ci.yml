          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        id: setup
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'test/example/priv/playwright/package-lock.json'
      - name: Cache example deps
        id: example_deps_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            test/example/deps
            test/example/_build
          key: ${{ runner.os }}-example-dev-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-dev-${{ hashFiles('test/example/mix.lock', 'test/example/config/**', 'test/example/lib/**/*.ex', 'lib/**/*.ex', 'mix.exs') }}-v1
          restore-keys: ${{ runner.os }}-example-dev-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-dev-
      - name: Fetch example deps
        working-directory: test/example
        env:
          MIX_ENV: dev
        run: mix deps.get
      - name: Compile example
        working-directory: test/example
        env:
          MIX_ENV: dev
        run: mix compile --warnings-as-errors
      - name: Setup example dev DB
        working-directory: test/example
        env:
          MIX_ENV: dev
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix ecto.create && mix ecto.migrate
      - name: Run demo seeds
        working-directory: test/example
        env:
          MIX_ENV: dev
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix run priv/repo/seeds.exs
      - name: Install Playwright deps
        working-directory: test/example/priv/playwright
        run: npm ci
      - name: Install Playwright browsers
        working-directory: test/example/priv/playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Boot example app in background
        working-directory: test/example
        env:
          MIX_ENV: dev
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PHX_SERVER: "true"
        # WR-04: redirect stdout+stderr so boot output is not interleaved
        # with later step output and is recoverable via a dedicated failure
        # step. See also: install_matrix:291, admin-acceptance-smoke.sh:207.
        run: mix phx.server > /tmp/example-playwright-server.log 2>&1 &
      - name: Wait for app and warm up LiveView routes
        run: |
          # Wait for root.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/ > /dev/null; then
              echo "App responding after ${i}s"
              break
            fi
            sleep 1
          done
          # Warm up the routes the test will hit. With `plug_init_mode:
          # :runtime` in dev, first-touch of each route pays compile-on-
          # demand latency — without this, Playwright's first toHaveURL
          # check on /users/register races the first LiveView compile.
          for path in /users/register /users/log_in /users/confirm /dev/mailbox /users/sessions /users/sudo /users/settings/mfa /admin/users; do
            curl -sf -o /dev/null "http://localhost:4000${path}" \
              && echo "warmed ${path}" \
              || echo "warmup miss ${path} (non-fatal)"
          done
      # Phase 31 Plan 4 (D-19..D-25, D-26..D-30): run admin browser truth,
      # admin checkpoints, and non-admin browser smoke as separate seams
      # within a single job so each failure surfaces against its seam while
      # keeping one shared booted example app.
      - name: Run admin behavior browser truth (chromium)
        id: admin_behavior
        if: ${{ !cancelled() }}
        working-directory: test/example/priv/playwright
        env:
          CI: "true"
          SIGRA_EXAMPLE_URL: "http://localhost:4000"
        # D-04, D-27: the canonical Phase 31 browser contract specs. They run
        # only on the `chromium` project per wave 1's partitioning
        # (playwright.config.ts). admin-modal-interaction (PAGE-03 ConfirmDialog
        # APG gates) is wired in here so the ConfirmDialog hook's
        # focus-trap/Escape/focus-return behavior is actually guarded — it was
        # authored in phase 189 but previously never run in CI.
        run: |
          npx playwright test \
            tests/admin-user-operations.spec.ts \
            tests/impersonation.spec.ts \
            tests/admin-audit.spec.ts \
            tests/admin-modal-interaction.spec.ts \
            --project=chromium
      - name: Run admin checkpoints (chromium, mobile, dark-chromium)
        id: admin_checkpoints
        if: ${{ !cancelled() }}
        working-directory: test/example/priv/playwright
        env:
          CI: "true"
          SIGRA_EXAMPLE_URL: "http://localhost:4000"
        # D-26..D-30: the admin-checkpoints.spec.ts fan-out runs once per
        # project — `admin-checkpoints-chromium` (desktop), `admin-checkpoints-mobile`
        # (mobile viewport), and `admin-checkpoints-dark` (the dark-chromium
        # checkpoint lane using `colorScheme: 'dark'`). Mobile and dark-mode
        # admin regressions therefore surface from this seam alone without
        # rerunning the full behavior suite across every theme and viewport.
        run: |
          npx playwright test \
            tests/admin-checkpoints.spec.ts \
            --project=admin-checkpoints-chromium \
            --project=admin-checkpoints-mobile \
            --project=admin-checkpoints-dark
      # Playwright clears test-results/ at the START of each `playwright test`
      # invocation, so stage the curated admin checkpoint PNGs IMMEDIATELY after
      # the checkpoints run — before the design-gallery / non-admin / demo-showcase
      # steps below each wipe test-results. (The design-gallery step was inserted
      # between checkpoints and this staging step in v1.39 and was silently wiping
      # the PNGs, so the artifact bundle contract found 0.)
      - name: Stage admin checkpoint PNGs (before later runs clear test-results)
        if: ${{ steps.admin_checkpoints.outcome == 'success' }}
        working-directory: test/example/priv/playwright
        run: |
          mkdir -p artifacts/admin-checkpoints/
          if compgen -G "test-results/**/admin-*.png" > /dev/null; then
            src_count=$(find test-results -type f -name 'admin-*.png' | wc -l)
            echo "staging ${src_count} admin-*.png file(s) from test-results/"
            find test-results -type f -name 'admin-*.png' -exec cp -n {} artifacts/admin-checkpoints/ \;
          else
            echo "warning: no admin-*.png under test-results/ after admin checkpoints"
          fi
          ls -la artifacts/admin-checkpoints/ || true
      - name: Run design gallery boards (chromium, mobile, dark)
        id: design_gallery
        if: ${{ !cancelled() }}
        # TEMP SOFT-GATE (bootstrap ordering — REMOVE in follow-up after recapture lands):
        # The committed admin-design baselines are macOS-captured and
        # playwright.config.ts omits the OS suffix, so the very PR that delivers the
        # admin_design_recapture job cannot pass this step on ubuntu — ubuntu-native
        # baselines only exist AFTER admin_design_recapture runs (push/schedule,
        # post-merge). Re-gating (D-10) before those baselines are on main is a
        # deadlock. So for the v1.40 ship this step is soft. SEQUENCE TO COMPLETE D-10:
        #   1. merge v1.40 (this soft gate) -> push-to-main fires admin_design_recapture
        #   2. merge the recapture PR (ubuntu-native PNGs land on main)
        #   3. follow-up PR removes this continue-on-error -> hard gate restored & green
        continue-on-error: true
        working-directory: test/example/priv/playwright
        env:
          CI: "true"
          SIGRA_EXAMPLE_URL: "http://localhost:4000"
        # HARD-GATING (Phase 197 / D-10): continue-on-error removed; gallery
        # now fails the job via the aggregator on any visual regression.
        # Root-cause correction (D-07): the original non-blocking premise was that
        # "the brand webfont does not load in CI dev-mode boot" — that was factually
        # wrong (no @font-face, no *.woff2, and no Google Fonts link was ever served;
        # the ~20–53px height delta was an OS system-ui font-metric difference between
        # the macOS capture box and the ubuntu CI runner).
        # Remediation (Plans 03–04): a self-hosted Space Grotesk variable woff2 is now
        # committed to test/example/priv/static/assets/fonts/ and wired via @font-face
        # + --font-sans in app.css; admin-design.spec.ts awaits document.fonts.ready +
        # asserts fonts.check before any snapshot; CI-native baselines were recaptured
        # by the admin_design_recapture sibling job and merged. Render is now
        # OS-independent and the gallery can hard-gate again (SEED-006 addressed).
        run: |
          npx playwright test \
            tests/admin-design.spec.ts \
            --project=admin-design-chromium \
            --project=admin-design-mobile \
            --project=admin-design-dark
      - name: Run non-admin example browser smoke
        id: non_admin_smoke
        if: ${{ !cancelled() }}
        working-directory: test/example/priv/playwright
        env:
          CI: "true"
          SIGRA_EXAMPLE_URL: "http://localhost:4000"
        # Keeps non-admin coverage (golden-path, organizations, passkey-*)
        # in its own step so admin failures isolate cleanly. These run on
        # the default `chromium` project; mobile coverage for these specs
        # runs on the `mobile` project which excludes admin behavior/
        # checkpoint specs per wave 1 partitioning.
        run: |
          npx playwright test \
            tests/golden-path.spec.ts \
            tests/ga-uat-shift-left.spec.ts \
            tests/passkeys-hooks.spec.ts \
            tests/organizations.spec.ts \
            tests/passkey-login.spec.ts \
            tests/passkey-options.spec.ts
      - name: Run demo-showcase spec (demo-showcase-chromium)
        id: demo_showcase
        if: ${{ !cancelled() }}
        working-directory: test/example/priv/playwright
        env:
          CI: "true"
          SIGRA_EXAMPLE_URL: "http://localhost:4000"
        run: |
          npx playwright test \
            tests/demo-showcase.spec.ts \
            --project=demo-showcase-chromium
      - name: Aggregate Playwright step outcomes
        if: always()
        # D-02 (197-02): re-fails the job if any guarded seam returned 'failure'.
        # Without this step, !cancelled() guards allow later seams to run after
        # an early failure but the job would silently go green. The aggregator
        # is the load-bearing integrity control (T-197-03).
        #
        # TEMP (bootstrap ordering — RESTORE design_gallery here in the same follow-up
        # that removes its continue-on-error): design_gallery is intentionally OMITTED
        # from this loop while it is soft-gated. continue-on-error only changes a step's
        # *conclusion*, not its *outcome*, so leaving it in would re-fail the job on the
        # macOS-vs-ubuntu baseline mismatch and re-create the ship deadlock. See
        # .planning/todos/pending/2026-06-20-complete-d10-design-gallery-re-gate-after-recapture.md
        run: |
          set -euo pipefail
          fail=0
          for o in "${{ steps.admin_behavior.outcome }}" \
                   "${{ steps.admin_checkpoints.outcome }}" \
                   "${{ steps.non_admin_smoke.outcome }}" \
                   "${{ steps.demo_showcase.outcome }}"; do
            [ "$o" = "failure" ] && fail=1
          done
          if [ "$fail" -eq 1 ]; then
            echo "::error::one or more Playwright seams failed"; exit 1
          fi
          echo "all seams passed"
      - name: Dump example app log (on failure)
        if: failure()
        # WR-04: surface the backgrounded server log directly in the
        # failure step so investigators do not need to pull the retained-
        # video artifact to see why boot or a runtime exception killed a
        # Playwright run.
        run: |
          echo "--- /tmp/example-playwright-server.log ---"
          cat /tmp/example-playwright-server.log || echo "(no log file)"
      - name: Cache hit summary
        if: always()
        run: |
          {
            echo "## example_playwright_smoke cache"
            echo "- deps cache (exact hit): ${{ steps.example_deps_cache.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect curated admin checkpoint screenshots
        if: always()
        working-directory: test/example/priv/playwright
        # D-19, D-20, D-25: curated reviewer screenshots for passing admin
        # runs come from explicit test-authored PNGs (adminArtifactName),
        # not indiscriminate whole-run directories. Gather them under a
        # predictable path so `admin-example-report` can always publish the
        # reviewer bundle without shipping traces or retained video from
        # every passing run.
        run: |
          mkdir -p artifacts/admin-checkpoints/
          if compgen -G "test-results/**/admin-*.png" > /dev/null; then
            # WR-03: `cp -n` (no-clobber) surfaces basename collisions as
            # cp warnings instead of silently overwriting an earlier
            # checkpoint with a later one. adminArtifactName embeds the
            # project slug so distinct lanes should not collide today, but
            # if a test ever calls captureAdminCheckpoint twice with the
            # same name, the second copy is skipped rather than eating the
            # first. Pair with the source count below so reviewers can
            # eyeball expected-vs-collected from the step log.
            src_count=$(find test-results -type f -name 'admin-*.png' | wc -l)
            echo "source admin-*.png count under test-results/: ${src_count}"
            find test-results -type f -name 'admin-*.png' -exec cp -n {} artifacts/admin-checkpoints/ \;
          fi
          echo "curated admin checkpoint screenshots:"
          ls -la artifacts/admin-checkpoints/ || true
      - name: Admin artifact bundle contract (Phase 35)
        if: success()
        run: bash scripts/ci/admin-artifact-bundle-contract.sh test/example/priv/playwright/artifacts/admin-checkpoints
      # D-19, D-22: green-run reviewer bundle scoped to this dedicated admin
      # job. Published on every run (success or failure) so the Playwright
      # HTML report plus the curated checkpoint PNGs are always available;
      # D-21's richer diagnostics upload is separate.
      #
      # D-23: branch-aware retention is expressed as two mutually exclusive
      # upload steps — 14 days for main/release runs, 7 days for PR/push
      # runs. Keeping the retention values literal makes the policy grep-
      # auditable from the workflow file without having to read GitHub
      # Actions expression evaluation rules.
      - name: Upload admin example review bundle (main, 14d retention)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: admin-example-report
          path: |
            test/example/priv/playwright/playwright-report/
            test/example/priv/playwright/artifacts/admin-checkpoints/
          retention-days: 14
      - name: Upload admin example review bundle (PR/push, 7d retention)
        if: always() && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: admin-example-report
          path: |
            test/example/priv/playwright/playwright-report/
            test/example/priv/playwright/artifacts/admin-checkpoints/
          retention-days: 7
      # D-21, D-24: traces, failure screenshots, and retained videos (from
      # the selective `video: 'retain-on-failure'` on checkpoint and
      # admin-generated projects) land under test-results/. This bundle
      # uploads only on failure per D-20/D-22 so the success review bundle
      # stays lightweight. Retention mirrors the review bundle policy.
      - name: Upload admin example failure diagnostics (main, 14d retention)
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: admin-example-failure-diagnostics
          path: test/example/priv/playwright/test-results/
          retention-days: 14
      - name: Upload admin example failure diagnostics (PR/push, 7d retention)
        if: failure() && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: admin-example-failure-diagnostics
          path: test/example/priv/playwright/test-results/
          retention-days: 7

  generated_admin_playwright_smoke:
    name: Generated admin Playwright smoke
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: release_ref_guard
    # Cold mix phx.new + compile + Playwright can exceed 30m on busy runners;
    # 45–60m is the tuned band for this job.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'test/example/priv/playwright/package-lock.json'
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new 1.8.7
      - name: Install Playwright deps
        working-directory: test/example/priv/playwright
        run: npm ci
      - name: Install Playwright browsers
        working-directory: test/example/priv/playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Run generated admin acceptance smoke
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          GITHUB_WORKSPACE: ${{ github.workspace }}
          PLAYWRIGHT_RETRIES: 1
        # Phase 31 Plan 4 (D-10, D-11, D-17): the generated-host parity
        # seam runs the full acceptance target (`--test all` — both the
        # desktop/mobile shell and the denial-response assertions) so
        # generated-host admin parity stays explicit and narrow rather
        # than collapsing into a single monolithic verification job.
        run: scripts/ci/admin-acceptance-smoke.sh --test all
      - name: Collect curated generated-host admin screenshots
        if: always()
        working-directory: test/example/priv/playwright
        # D-19, D-20, D-25: curated reviewer PNGs for the generated-host
        # admin checkpoints live alongside the example-app bundle so
        # reviewers can diff generated vs example parity with the same
        # artifact naming convention.
        run: |
          mkdir -p artifacts/admin-checkpoints/
          if compgen -G "test-results/**/admin-*.png" > /dev/null; then
            # WR-03: `cp -n` (no-clobber) surfaces basename collisions as
            # cp warnings instead of silently overwriting an earlier
            # checkpoint. See the matching block in the example_playwright
            # _smoke job for the full rationale. Visible src_count pairs
            # "expected" with ls -la's "collected" under this step's log.
            src_count=$(find test-results -type f -name 'admin-*.png' | wc -l)
            echo "source admin-*.png count under test-results/: ${src_count}"
            find test-results -type f -name 'admin-*.png' -exec cp -n {} artifacts/admin-checkpoints/ \;
          fi
          echo "curated generated-host admin screenshots:"
          ls -la artifacts/admin-checkpoints/ || true
      # D-19, D-22: green-run generated-host reviewer bundle scoped to this
      # dedicated admin parity job. Always uploaded so the Playwright HTML
      # report and curated PNGs are available without needing the richer
      # diagnostic bundle on successful runs.
      #
      # D-23: branch-aware retention expressed as two mutually exclusive
      # upload steps — 14 days for main/release runs, 7 days for PR/push
      # runs. Keeping the retention values literal makes the policy grep-
      # auditable from the workflow file.
      - name: Upload generated admin review bundle (main, 14d retention)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: generated-admin-report
          path: |
            test/example/priv/playwright/playwright-report/
            test/example/priv/playwright/artifacts/admin-checkpoints/
          retention-days: 14
      - name: Upload generated admin review bundle (PR/push, 7d retention)
        if: always() && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: generated-admin-report
          path: |
            test/example/priv/playwright/playwright-report/
            test/example/priv/playwright/artifacts/admin-checkpoints/
          retention-days: 7
      # D-21, D-24: failure bundle publishes test-results/ so retained
      # video (selective `retain-on-failure` on the `admin-generated`
      # project), traces, and failure screenshots are published alongside
      # the HTML report only when this job fails — keeping the seam's
      # successful-run artifact policy lightweight per D-22.
      - name: Upload generated admin failure diagnostics (main, 14d retention)
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: generated-admin-failure-diagnostics
          path: test/example/priv/playwright/test-results/
          retention-days: 14
      - name: Upload generated admin failure diagnostics (PR/push, 7d retention)
        if: failure() && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: generated-admin-failure-diagnostics
          path: test/example/priv/playwright/test-results/
          retention-days: 7

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs:
      - install_golden_contract
      - library_tests
      - library_tests_dep_off
      - install_smoke
      - upgrade_smoke
      - example_http_smoke
      - example_playwright_smoke
      - generated_admin_playwright_smoke
      - fast_checks
    if: always()
    steps:
      - name: Verify required release CI lanes
        env:
          INSTALL_GOLDEN_CONTRACT: ${{ needs.install_golden_contract.result }}
          LIBRARY_TESTS: ${{ needs.library_tests.result }}
          LIBRARY_TESTS_DEP_OFF: ${{ needs.library_tests_dep_off.result }}
          INSTALL_SMOKE: ${{ needs.install_smoke.result }}
          UPGRADE_SMOKE: ${{ needs.upgrade_smoke.result }}
          EXAMPLE_HTTP_SMOKE: ${{ needs.example_http_smoke.result }}
          EXAMPLE_PLAYWRIGHT_SMOKE: ${{ needs.example_playwright_smoke.result }}
          GENERATED_ADMIN_PLAYWRIGHT_SMOKE: ${{ needs.generated_admin_playwright_smoke.result }}
          FAST_CHECKS: ${{ needs.fast_checks.result }}
        run: |
          set -euo pipefail
          failed=0
          for lane in \
            INSTALL_GOLDEN_CONTRACT \
            LIBRARY_TESTS \
            LIBRARY_TESTS_DEP_OFF \
            INSTALL_SMOKE \
            UPGRADE_SMOKE \
            EXAMPLE_HTTP_SMOKE \
            EXAMPLE_PLAYWRIGHT_SMOKE \
            GENERATED_ADMIN_PLAYWRIGHT_SMOKE \
            FAST_CHECKS
          do
            result="${!lane}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Required release lane $lane: $result"
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "ci-gate failed: one or more required release lanes did not succeed."
            exit 1
          fi
          echo "ci-gate passed: all required release lanes succeeded."

  # D-09 (197-04): dedicated non-PR-gated job that recaptures the 72 admin-design
  # baselines in-CI so the committed PNGs match what ubuntu CI renders. This job
  # carries job-level `permissions: contents: write` (the workflow default is
  # `contents: read`, ci.yml:26) so it can commit the recaptured PNGs. It is
  # NOT in ci-gate.needs — it is a one-time recapture utility, not a PR gate.
  # The recaptured PNGs land on a ci/recapture-admin-design-<run_id> branch and
  # a PR is opened for human review (OQ2) before anything merges to main.
  admin_design_recapture:
    name: Recapture admin-design baselines (in-CI)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: release_ref_guard
    permissions:
      contents: write   # REQUIRED — workflow default is `contents: read` (ci.yml:26)
      pull-requests: write  # required for gh pr create
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      # Boot prelude — verbatim clone of example_playwright_smoke (ci.yml:886–968)
      # with the same SHA-pinned actions, MIX_ENV: dev, and readiness loops.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        id: setup
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'test/example/priv/playwright/package-lock.json'
      - name: Cache example deps
        id: recapture_example_deps_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            test/example/deps
            test/example/_build
          key: ${{ runner.os }}-example-dev-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-dev-${{ hashFiles('test/example/mix.lock', 'test/example/config/**', 'test/example/lib/**/*.ex', 'lib/**/*.ex', 'mix.exs') }}-v1
          restore-keys: ${{ runner.os }}-example-dev-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-dev-
      - name: Fetch example deps
        working-directory: test/example
        env:
          MIX_ENV: dev
        run: mix deps.get
      - name: Compile example
        working-directory: test/example
        env:
          MIX_ENV: dev
        run: mix compile --warnings-as-errors
      - name: Setup example dev DB
        working-directory: test/example
        env:
          MIX_ENV: dev
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix ecto.create && mix ecto.migrate
      - name: Run demo seeds
        working-directory: test/example
        env:
          MIX_ENV: dev
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix run priv/repo/seeds.exs
      - name: Install Playwright deps
        working-directory: test/example/priv/playwright
        run: npm ci
      - name: Install Playwright browsers
        working-directory: test/example/priv/playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Boot example app in background
        working-directory: test/example
        env:
          MIX_ENV: dev
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PHX_SERVER: "true"
        # WR-04: redirect stdout+stderr so boot output is not interleaved with
        # step output and is recoverable via the failure dump step below.
        run: mix phx.server > /tmp/example-recapture-server.log 2>&1 &
      - name: Wait for app and warm up LiveView routes
        run: |
          # Wait for root.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/ > /dev/null; then
              echo "App responding after ${i}s"
              break
            fi
            sleep 1
          done
          # Warm up the routes the test will hit — first-touch pays compile-on-demand
          # latency in dev mode.
          for path in /users/register /users/log_in /users/confirm /dev/mailbox /users/sessions /users/sudo /users/settings/mfa /admin/users; do
            curl -sf -o /dev/null "http://localhost:4000${path}" \
              && echo "warmed ${path}" \
              || echo "warmup miss ${path} (non-fatal)"
          done
      - name: Re-establish board-notice canary (OQ1 deliberate re-baseline)
        # OQ1: The global --font-sans override modifies board-notice (the design-lane
        # canary). snapshot-canary-guard.sh forbids a canary *modify* (line 104) but
        # tolerates a canary *added* (line 100). To re-establish the canary with the
        # new font, delete the existing board-notice PNGs BEFORE --update-snapshots
        # so Playwright re-creates them as newly-added files rather than modifications.
        # This is a one-time deliberate re-baseline, NOT allowlisting the canary.
        run: |
          echo "Removing existing board-notice PNGs so recapture creates them as 'added' (not 'modified')"
          find test/example/priv/playwright/tests/admin-design.spec.ts-snapshots \
            -name 'board-notice-admin-design-*.png' -delete || true
          echo "Removed board-notice PNGs:"
          ls test/example/priv/playwright/tests/admin-design.spec.ts-snapshots/ | grep board-notice || echo "(none — deletion successful)"
      - name: Recapture admin-design baselines
        # D-09: recapture all 72 admin-design PNGs (24 boards × chromium/mobile/dark)
        # in the ubuntu CI environment so the committed baselines match what CI renders.
        # The fonts.check hard guard in waitForLiveViewReady (197-03) ensures the font
        # is loaded before any snapshot is taken.
        working-directory: test/example/priv/playwright
        env:
          CI: "true"
          SIGRA_EXAMPLE_URL: "http://localhost:4000"
        run: |
          npx playwright test \
            tests/admin-design.spec.ts \
            --project=admin-design-chromium \
            --project=admin-design-mobile \
            --project=admin-design-dark \
            --update-snapshots
      - name: Gate recaptured baselines via snapshot-canary-guard and commit to PR branch (OQ1, OQ2)
        # OQ1 (board-notice canary re-baseline): board-notice PNGs were deleted before
        # recapture so they appear as 'added' to the guard — the guard's legitimate birth
        # path (line 100). NOT allowlisted (canary is never allowlistable); NOT a
        # forbidden 'modify'. The tripwire stays armed for future incremental PRs.
        #
        # OQ2 (reviewable commit): recaptured PNGs land on a ci/recapture-admin-design-<run_id>
        # branch and a PR is opened via gh pr create — baseline changes get human review
        # under branch protection rather than a silent push to main. The commit carries
        # [skip ci] to avoid re-triggering this job.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SNAP_DIR="test/example/priv/playwright/tests/admin-design.spec.ts-snapshots"

          # Compute changed slugs (tracked diff vs HEAD + untracked new files).
          # slug_of: strip -admin-design-{chromium,mobile,dark}.png suffix.
          declare -A seen_slugs=()
          while IFS=$'\t' read -r status path; do
            [[ -z "${path:-}" ]] && continue
            case "$path" in "${SNAP_DIR}"/*.png) ;; *) continue;; esac
            sl=$(basename "$path" | sed -E 's/-admin-design-(chromium|mobile|dark)\.png$//')
            seen_slugs["$sl"]=1
          done < <(git diff --name-status HEAD -- "$SNAP_DIR" 2>/dev/null || true)
          while IFS= read -r line; do
            [[ "$line" == '??'* ]] || continue
            path="${line:3}"
            case "$path" in "${SNAP_DIR}"/*.png) ;; *) continue;; esac
            sl=$(basename "$path" | sed -E 's/-admin-design-(chromium|mobile|dark)\.png$//')
            seen_slugs["$sl"]=1
          done < <(git status --porcelain -- "$SNAP_DIR" 2>/dev/null || true)

          echo "Changed slugs: ${!seen_slugs[*]}"

          # Build --allow args for all non-canary changed slugs.
          allow_args=()
          for sl in "${!seen_slugs[@]}"; do
            if [[ "$sl" != "board-notice" ]]; then
              allow_args+=(--allow "$sl")
            fi
          done

          # Run canary guard. board-notice should appear as 'added' (deleted before
          # recapture) which the guard tolerates (line 100 of snapshot-canary-guard.sh).
          bash scripts/ci/snapshot-canary-guard.sh \
            --base HEAD \
            --allowlist test/example/priv/playwright/snapshot-allowlist-design \
            --canary board-notice \
            "${allow_args[@]}"

          # OQ2: commit to a reviewable branch, not main.
          BRANCH="ci/recapture-admin-design-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$SNAP_DIR/"
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit -- baselines already match CI render."
          else
            git commit -m "ci(197): recapture admin-design baselines in ubuntu CI [skip ci]"
            git push origin "$BRANCH"
            gh pr create \
              --title "ci: recapture admin-design baselines in ubuntu CI (${{ github.run_id }})" \
              --body "Admin-design baseline recapture (automated). Triggered by the global --font-sans Space Grotesk override (Phase 197-03). OQ1: board-notice canary re-established as added (not modified). OQ2: reviewable PR instead of push to main. Merge after visual review." \
              --base main \
              --head "$BRANCH"
          fi
      - name: Check cross-lane baseline drift from global --font-sans (OQ3, COMPARE mode only)
        # OQ3: the :root --font-sans override is global; admin-checkpoints and demo-showcase
        # may also shift under the font change. Run both in COMPARE mode (no --update-snapshots)
        # against the font-loaded app to measure drift without recapturing them.
        #
        # Outcome A: both pass within existing tolerance -> scope stays admin-design only.
        # Outcome B: either fails -> this step records the shift; the job continues but
        #   a tracked todo is written below (see next step). Do NOT recapture sibling lanes
        #   here (wrong-canary risk per OQ3 resolution).
        #
        # continue-on-error: true so a font-driven compare failure does not block the
        # recapture job from committing its PNGs and opening the PR (the PR is the
        # deliverable; OQ3 is a measurement step).
        id: cross_lane_compare
        continue-on-error: true
        working-directory: test/example/priv/playwright
        env:
          CI: "true"
          SIGRA_EXAMPLE_URL: "http://localhost:4000"
        run: |
          echo "=== OQ3: running admin-checkpoints in COMPARE mode (no --update-snapshots) ==="
          npx playwright test \
            tests/admin-checkpoints.spec.ts \
            --project=admin-checkpoints-chromium \
            --project=admin-checkpoints-mobile \
            --project=admin-checkpoints-dark
          CHECKPOINTS_EXIT=$?
          echo "=== OQ3: running demo-showcase in COMPARE mode (no --update-snapshots) ==="
          npx playwright test \
            tests/demo-showcase.spec.ts \
            --project=demo-showcase-chromium
          DEMO_EXIT=$?
          echo "cross_lane_checkpoints_exit=${CHECKPOINTS_EXIT}" >> "$GITHUB_OUTPUT"
          echo "cross_lane_demo_exit=${DEMO_EXIT}" >> "$GITHUB_OUTPUT"
          if [[ "$CHECKPOINTS_EXIT" -ne 0 || "$DEMO_EXIT" -ne 0 ]]; then
            echo "OQ3: one or more sibling lanes shifted under the global --font-sans change."
            exit 1
          fi
          echo "OQ3: all sibling lanes pass within existing tolerance -- scope stays admin-design only."
      - name: Record OQ3 cross-lane drift result (tracked todo if shift detected)
        # OQ3: if either sibling lane shifted, write a tracked todo with the concrete
        # per-lane recapture path so the shift is not silently ignored. If both passed,
        # record that the font does not move them (scope stays admin-design only).
        if: always()
        run: |
          if [[ "${{ steps.cross_lane_compare.outcome }}" == "failure" ]]; then
            echo "OQ3: sibling lane(s) shifted -- creating tracked todo."
            mkdir -p .planning/todos/pending
            TODO_DATE=$(date -u +%Y-%m-%d)
            TODO_FILE=".planning/todos/pending/${TODO_DATE}-oq3-cross-lane-font-drift.md"
            {
              echo "# OQ3: Cross-lane font drift - sibling lane recapture needed"
              echo ""
              echo "Created: Auto-generated by admin_design_recapture CI job (OQ3 resolution)"
              echo "Trigger: Global --font-sans Space Grotesk override (Phase 197-03) shifted one or"
              echo "more sibling Playwright lanes when run in COMPARE mode against the font-loaded app."
              echo ""
              echo "## Which lane(s) shifted"
              echo ""
              echo "Check the admin_design_recapture CI job output (Step: Check cross-lane baseline drift)"
              echo "for the specific compare failure. OQ3 runs admin-checkpoints and demo-showcase in"
              echo "COMPARE mode; if either exits non-zero, that lane's baselines shifted."
              echo ""
              echo "## Per-lane recapture commands"
              echo ""
              echo "### admin-checkpoints lane"
              echo "Boot example app on :4011 (avoid Rulestead Docker on :4000), then:"
              echo "  cd test/example/priv/playwright"
              echo "  SIGRA_EXAMPLE_URL=http://localhost:4011 npx playwright test tests/admin-checkpoints.spec.ts \\"
              echo "    --project=admin-checkpoints-chromium --project=admin-checkpoints-mobile --project=admin-checkpoints-dark \\"
              echo "    --update-snapshots"
              echo "  # Then gate through snapshot-recapture-gate.sh (NOT snapshot-canary-guard.sh)"
              echo "  # The admin-checkpoints canary is: impersonation-banner"
              echo "  # The admin-checkpoints allowlist is: test/example/priv/playwright/snapshot-allowlist"
              echo "  bash scripts/ci/snapshot-recapture-gate.sh --canary impersonation-banner --allow <each changed non-canary slug>"
              echo ""
              echo "### demo-showcase lane"
              echo "Boot example app, then:"
              echo "  cd test/example/priv/playwright"
              echo "  SIGRA_EXAMPLE_URL=http://localhost:4011 npx playwright test tests/demo-showcase.spec.ts \\"
              echo "    --project=demo-showcase-chromium --update-snapshots"
              echo "  # demo-showcase baselines live in tests/demo-showcase.spec.ts-snapshots/"
              echo "  # No dedicated canary guard for demo-showcase; review PNGs manually."
              echo ""
              echo "## Notes"
              echo "- Do NOT recapture these lanes in the admin_design_recapture job."
              echo "  Per-lane allowlist/canary names differ; wrong-canary recapture would arm/disarm the wrong tripwire."
              echo "- Plan 05 re-gate touches only the design lane's continue-on-error."
              echo "  A deferred sibling recapture does NOT block the re-gate."
              echo "- These lanes were green-gating pre-font; font-shifted lanes surface as a normal red."
            } > "$TODO_FILE"
            echo "Tracked todo written: $TODO_FILE"
            echo "OQ3 DEFERRED: one or more sibling lanes shifted. See tracked todo for per-lane recapture path."
          else
            echo "OQ3 CLOSED: admin-checkpoints and demo-showcase pass within existing tolerance."
            echo "The global --font-sans change does not move sibling lanes -- scope stays admin-design only."
          fi
      - name: Dump example app log (on failure)
        if: failure()
        # WR-04: surface the backgrounded server log directly in the failure step.
        run: |
          echo "--- /tmp/example-recapture-server.log ---"
          cat /tmp/example-recapture-server.log || echo "(no log file)"

  # D-14 forced-failure probe: a needs-free, nightly-gated job that proves the
  # nightly trigger path reports red on a real failure. Dispatching with
  # `gh workflow run "CI" -f force_fail_probe=true` reds this job and only
  # this job. Normal nightly/push/dispatch runs (force_fail_probe=false) keep
  # the step skipped and the job green. Never runs on pull_request events.
  # NOT in ci-gate.needs — it is a standalone self-test, not a gate input.
  nightly_probe:
    name: Nightly probe (forced-failure self-test)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Forced-failure probe (nightly self-test)
        if: ${{ inputs.force_fail_probe }}
        run: |
          echo "force_fail_probe=true: intentionally failing to prove the nightly lane reports red"
          exit 1
