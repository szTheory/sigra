name: CI

on:
  # Release-ref evidence path: manually dispatch this workflow from a v* tag
  # (`gh workflow run "CI" --ref v1.0.0` or Actions UI) to rerun canonical gates.
  workflow_dispatch:
    inputs:
      force_fail_probe:
        description: 'Intentionally fail a nightly-gated job to verify the nightly lane reports red (set true to probe).'
        required: false
        type: boolean
        default: false
  schedule:
    # Nightly-broad run (04:30 UTC). Avoids the 45 6 slot used by playwright-github-pages.yml.
    # Runs the 5 exhaustive/low-probability jobs that are skipped on pull_request events.
    - cron: '30 4 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for GITHUB_TOKEN: CI only reads the repo and
# uploads artifacts (via actions/upload-artifact, which does not require
# contents: write). Any job that needs additional scopes must override
# `permissions:` at the job level.
permissions:
  contents: read

# Note: Repository secret HEX_API_KEY (Hex.pm) is not read by this workflow unless
# you add an explicit publish job with `env: HEX_API_KEY: ${{ secrets.HEX_API_KEY }}`.
# Library/install failures are unrelated to that secret.

jobs:
  release_ref_guard:
    name: Release ref guard
    runs-on: ubuntu-latest
    steps:
      - name: Require release tag ref for manual release evidence
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Non-manual CI run; release-ref guard not applicable."
            exit 0
          fi
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *)
              echo "Manual CI release-evidence runs must use refs/tags/v*; got ${GITHUB_REF}"
              echo "Run with: gh workflow run \"CI\" --ref v1.0.0"
              exit 1
              ;;
          esac

  # Phase 194 (CACHE-02): 6 trivial leaf guard jobs folded into one fast_checks
  # job (single checkout + single base-ref resolve) to cut 6 runner cold-starts.
  # Each guard is a distinct named run: step so per-guard failure remains legible
  # in the Actions UI. release_ref_guard stays standalone (D-12).
  fast_checks:
    name: Fast checks (milestone/installer/contracts/snapshot/ledger guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - name: Resolve base ref
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - name: Milestone verification gate
        run: bash scripts/ci/milestone-verification-gate.sh
      - name: Detect installer-related changes (PRs only)
        id: detect
        shell: bash
        # Phase 51: include GA-adjacent lib surfaces (MFA/OAuth/account/passkeys) — see MAINTAINING.md §Installer golden CI contract.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^priv/templates/sigra\.install/|^lib/sigra/install/|^lib/sigra/mfa(\.ex|/)|^lib/sigra/oauth(\.ex|/)|^lib/sigra/account(\.ex|/)|^lib/sigra/passkeys(\.ex|/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Installer milestone audit (INT-01..03)
        if: steps.detect.outputs.run == 'true'
        run: bash scripts/ci/installer-milestone-audit.sh
      - name: Getting started doc contract
        run: bash scripts/ci/getting-started-contract.sh
      - name: Phase 34 UAT contracts
        run: scripts/ci/phase34-uat-contracts.sh
      - name: Snapshot drift guard (canary allowlist)
        run: bash scripts/ci/snapshot-canary-guard.sh --base "${{ steps.base.outputs.ref }}"
      - name: Snapshot drift guard — design lane
        run: |
          SNAP_DIR="test/example/priv/playwright/tests/admin-design.spec.ts-snapshots" \
          bash scripts/ci/snapshot-canary-guard.sh \
            --base "${{ steps.base.outputs.ref }}" \
            --allowlist test/example/priv/playwright/snapshot-allowlist-design \
            --canary board-notice
      - name: Quality ledger monotonic guard
        run: bash scripts/ci/quality-ledger-monotonic.sh --base "${{ steps.base.outputs.ref }}"

  install_golden_contract:
    name: Install golden + idempotency contract (subprocess harness)
    runs-on: ubuntu-latest
    needs: release_ref_guard
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sigra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - name: Detect installer-related changes (PRs only)
        id: detect
        shell: bash
        # Phase 51: include GA-adjacent lib surfaces (MFA/OAuth/account/passkeys) — see MAINTAINING.md §Installer golden CI contract.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^priv/templates/sigra\.install/|^lib/sigra/install/|^lib/sigra/mfa(\.ex|/)|^lib/sigra/oauth(\.ex|/)|^lib/sigra/account(\.ex|/)|^lib/sigra/passkeys(\.ex|/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        id: setup
        if: steps.detect.outputs.run == 'true'
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache library deps
        id: install_golden_deps_cache
        if: steps.detect.outputs.run == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-test-${{ hashFiles('mix.lock') }}-v1
          restore-keys: ${{ runner.os }}-library-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-test-
      - name: Install Hex + Rebar
        if: steps.detect.outputs.run == 'true'
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install phx_new archive
        if: steps.detect.outputs.run == 'true'
        run: mix archive.install --force hex phx_new 1.8.7
      - name: Fetch library deps
        if: steps.detect.outputs.run == 'true'
        run: mix deps.get
      - name: Run install golden + idempotency tests
        if: steps.detect.outputs.run == 'true'
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test test/sigra/install/golden_diff_test.exs test/sigra/install/idempotency_test.exs

  # TEST-01 (D-01/D-04): 2-leg matrix shard worker. Each leg gets its own
  # postgres service container (free DB isolation per D-05). The partition is NOT
  # in the cache key (D-06: both legs share one warm -library- entry).
  # fail-fast: false (D-01) so one shard failing does not cancel the sibling.
  library_tests_shard:
    name: Library tests shard ${{ matrix.partition }}
    runs-on: ubuntu-latest
    needs: release_ref_guard
    strategy:
      fail-fast: false            # D-01: one shard failing must NOT cancel the sibling
      matrix:
        partition: [1, 2]         # D-04: N=2
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          # Sigra.Test.PostgresRepo and admin/audit integration tests expect this DB to exist.
          POSTGRES_DB: sigra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        id: setup
        with:
          version-file: .tool-versions
          version-type: strict
      # D-06: cache key UNCHANGED from Phase 194 — partition is NOT in the key so
      # both legs share one warm -library- entry (no split, no doubled cold-compile).
      - name: Cache library deps
        id: deps_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-test-${{ hashFiles('mix.lock') }}-v1
          restore-keys: ${{ runner.os }}-library-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-test-
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      # phx_new archive is required by test/sigra/install/golden_diff_test.exs
      # and idempotency_test.exs — both use InstallFixture.setup_tmp_app/1
      # which shells out to `mix phx.new` to scaffold a fresh Phoenix app.
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new 1.8.7
      - name: Fetch library deps
        run: mix deps.get
      - name: Run library tests (shard ${{ matrix.partition }})
        env:
          MIX_ENV: test
          # TEST-01 (D-01): selects this leg's test file slice (round-robin by file).
          # Local repro: MIX_TEST_PARTITION=1 mix test --partitions 2
          MIX_TEST_PARTITION: ${{ matrix.partition }}
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: |
          set -o pipefail
          # Measurement gate (Task 2 / RESEARCH Pitfall 1):
          # Option (a) CHOSEN: keep --slowest 10 per shard (D-01 default).
          # ⚠ Note: --slowest forces --trace forces --max-cases 1 (serial within shard).
          # Parallelism is across legs (2 legs × serial-within); within-shard async is not unlocked.
          # Rationale: D-01 default; preserves per-test timing observability in $GITHUB_STEP_SUMMARY.
          # A/B evidence: Option (b) (drop --slowest) showed ~47% speedup on async-only files locally,
          # but the serial subprocess/DDL tests (~11 files, 23-33s each) bound the actual shard
          # walltime. The partition win (~halving the ~14m test portion to ~7-8m) is the primary gain.
          # Dropping --slowest (Option b) is deferred to a future phase if the subprocess serial tail
          # is addressed (D-15/D-20).
          mix test --partitions 2 --slowest 10 2>&1 | tee /tmp/library_tests_${{ matrix.partition }}.log
      - name: CI run summary
        if: always()
        run: |
          {
            echo "## library_tests shard ${{ matrix.partition }}"
            echo "- elixir: $(elixir --version | tail -1)"
            echo "- otp: $(erl -noshell -eval 'io:format("~s", [erlang:system_info(otp_release)]), halt().')"
            echo "- schedulers_online: $(elixir -e 'IO.write(System.schedulers_online())')"
            echo "- deps cache (exact hit): ${{ steps.deps_cache.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test timing summary
        if: always()
        run: |
          {
            echo "## Slowest tests (shard ${{ matrix.partition }})"
            echo '```'
            # Reuse the tee'd log from the shard run above — do NOT re-run.
            # Log path is partition-suffixed so both legs write distinct files (no collision).
            awk '/slowest/{f=1} f{print} /Finished in/{f=0}' /tmp/library_tests_${{ matrix.partition }}.log 2>/dev/null \
              || echo "(timing output unavailable)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # NOTE: `mix docs` (docs build check) REMOVED from this shard job (D-07).
      # Relocated to library_tests_dep_off which already has a compiled toolchain —
      # runs once per CI run, never per shard (N× cost for one artifact).

  # TEST-01 (D-02/D-03): Thin name-preserving aggregator. Reuses job id `library_tests`
  # and name `Library tests` — byte-identical to ruleset 14941512 required check string
  # (confirmed via gh api repos/szTheory/sigra/rulesets/14941512 at execution time).
  # A bare matrix on a named job emits "Library tests (1)"/"(2)" — never a bare
  # "Library tests" — which would orphan the required check (stuck pending → merge outage).
  # The aggregator restores the bare context and the job id ci-gate.needs references.
  # ci-gate is UNCHANGED (D-03): still needs: library_tests and reads needs.library_tests.result.
  library_tests:
    name: Library tests          # BYTE-IDENTICAL to ruleset 14941512 — DO NOT EDIT (D-02)
    runs-on: ubuntu-latest
    needs: [library_tests_shard]
    if: always()                 # must run even if a shard fails (mirrors ci-gate pattern)
    steps:
      - name: Require all library_tests shards to pass
        env:
          # needs.<matrix-job>.result is 'success' only if EVERY leg succeeded.
          # 'failure' if any leg failed — independent of fail-fast: false.
          SHARDS: ${{ needs.library_tests_shard.result }}
        run: |
          set -euo pipefail
          if [[ "$SHARDS" != "success" ]]; then
            echo "library_tests_shard result: $SHARDS"
            exit 1
          fi
          echo "all library_tests shards passed"

  library_tests_dep_off:
    name: Library tests (dep-off — Threadline absent)
    runs-on: ubuntu-latest
    needs: release_ref_guard
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          # Sigra.Test.PostgresRepo and admin/audit integration tests expect this DB to exist.
          POSTGRES_DB: sigra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        id: setup
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache library deps (dep-off lane)
        id: dep_off_deps_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-dep-off-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-test-${{ hashFiles('mix.lock') }}-v1
          restore-keys: ${{ runner.os }}-library-dep-off-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-test-
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new 1.8.7
      - name: Fetch library deps
        env:
          MIX_ENV: test
        run: mix deps.get
      # Compile deps BEFORE removing threadline. On a cache miss `_build` is empty,
      # and `mix compile --no-deps-check` (below) does not build dependencies — it
      # would compile the library against absent Ecto/Phoenix.LiveView and fail with
      # "module Ecto.Query is not loaded". Compiling deps first (in test env, the env
      # the project compile uses) makes the lane robust to cache misses.
      - name: Compile deps in test env (dep-off lane)
        env:
          MIX_ENV: test
        run: mix deps.compile
      # D-07: mix docs relocated here from the shard job (which is N× cost for one artifact).
      # This job already has a compiled toolchain (setup-beam + deps + compile above),
      # is not a shard, and runs exactly once per CI run — the correct host for docs.
      # MUST run BEFORE the threadline removal below: `mix docs` (MIX_ENV=dev) does a
      # deps check, and once :threadline is unlocked/cleaned that check fails with
      # "Unchecked dependencies ... Can't continue due to errors on dependencies".
      - name: Check docs build cleanly
        run: mix docs --warnings-as-errors
      - name: Remove :threadline from dep graph (dep-off lane)
        env:
          MIX_ENV: test
        run: |
          mix deps.unlock threadline
          mix deps.clean threadline --build
      - name: Compile without Threadline (proves Code.ensure_loaded? wraps work)
        env:
          MIX_ENV: test
        run: mix compile --warnings-as-errors --no-deps-check
      # D-10/D-11/D-14: Run only the :threadline_guard tagged subset.
      # `--only threadline_guard` fails RED on zero matches — a dropped/renamed tag turns CI red,
      # never silently green (the D-11 trust property). This matches the final command in the
      # `mix sigra.dep_off` alias exactly; local repro: MIX_ENV=test mix sigra.dep_off (D-14).
      - name: Run guard subset (Threadline absent — :threadline_guard tagged modules only)
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test --only threadline_guard --no-deps-check
      - name: Cache hit summary
        if: always()
        run: |
          {
            echo "## library_tests_dep_off cache"
            echo "- deps cache (exact hit): ${{ steps.dep_off_deps_cache.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"

  example_unit_smoke:
    name: Example unit smoke (ExUnit + ConnTest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        id: setup
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache example deps
        id: example_unit_deps_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            test/example/deps
            test/example/_build
          key: ${{ runner.os }}-example-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-test-${{ hashFiles('test/example/mix.lock', 'test/example/config/**', 'test/example/lib/**/*.ex', 'lib/**/*.ex', 'mix.exs') }}-v1
          restore-keys: ${{ runner.os }}-example-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-test-
      - name: Fetch example deps
        working-directory: test/example
        run: mix deps.get
      - name: Compile example
        working-directory: test/example
        run: mix compile --warnings-as-errors
      - name: Setup database
        working-directory: test/example
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix ecto.create && mix ecto.migrate
      - name: Run smoke tests
        working-directory: test/example
        env:
          MIX_ENV: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: mix test --include example_app
      - name: Cache hit summary
        if: always()
        run: |
          {
            echo "## example_unit_smoke cache"
            echo "- deps cache (exact hit): ${{ steps.example_unit_deps_cache.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"

  install_smoke:
    # Also closes SEED-3 / UAT-01 greenfield: `mix sigra.gen.oauth` + path/migration/router
    # checks (see scripts/ci/install-smoke.sh and docs/uat-ci-coverage.md).
    name: Install smoke (fresh phx.new + sigra.install)
    runs-on: ubuntu-latest
    needs: release_ref_guard
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        id: setup
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache Sigra library deps
        id: install_smoke_deps_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-test-${{ hashFiles('mix.lock') }}-v1
          restore-keys: ${{ runner.os }}-library-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-test-
      - name: Cache Hex registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.hex
          key: ${{ runner.os }}-hex-registry-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-hex-registry-
      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install phx_new archive
        run: mix archive.install --force hex phx_new 1.8.7
      - name: Fetch Sigra library deps
        run: mix deps.get
      - name: Run install smoke harness
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          GITHUB_WORKSPACE: ${{ github.workspace }}
          # Fresh tmp_app includes Cloak.Vault; compile/boot needs a dummy key (same as admin-acceptance-smoke.sh).
          CLOAK_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: scripts/ci/install-smoke.sh
      - name: Cache hit summary
        if: always()
        run: |
          {
            echo "## install_smoke cache"
            echo "- deps cache (exact hit): ${{ steps.install_smoke_deps_cache.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"

  upgrade_smoke:
    name: Upgrade smoke (published source series -> local candidate)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: release_ref_guard
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1.24.0
        id: setup
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache Sigra library deps
        id: upgrade_smoke_deps_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            deps
            _build
