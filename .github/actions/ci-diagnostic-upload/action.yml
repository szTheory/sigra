name: Upload invocation-bound CI diagnostics
description: Stage an explicit invocation manifest and retain its verified archive for seven days.

inputs:
  invocation-root:
    description: Invocation-owned directory containing only manifest-listed evidence files.
    required: true
  manifest:
    description: Path to the invocation identity and explicit file allowlist JSON.
    required: true
  bundle-output:
    description: New archive path to create under RUNNER_TEMP.
    required: true
  artifact-name:
    description: Unique run/attempt/job/seam/invocation artifact name.
    required: true

runs:
  using: composite
  steps:
    - name: Stage and verify explicit diagnostic bundle
      shell: bash
      env:
        INVOCATION_ROOT: ${{ inputs.invocation-root }}
        INVOCATION_MANIFEST: ${{ inputs.manifest }}
        BUNDLE_OUTPUT: ${{ inputs.bundle-output }}
      run: |
        set -euo pipefail
        python3 -B "$GITHUB_WORKSPACE/scripts/ci/ci-diagnostic-bundle.py" stage \
          --invocation-root "$INVOCATION_ROOT" \
          --manifest "$INVOCATION_MANIFEST" \
          --output "$BUNDLE_OUTPUT"
        python3 -B "$GITHUB_WORKSPACE/scripts/ci/ci-diagnostic-bundle.py" verify \
          --bundle "$BUNDLE_OUTPUT" \
          --manifest "$INVOCATION_MANIFEST"
    - name: Retain verified diagnostic bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.bundle-output }}
        retention-days: 7
        if-no-files-found: error
