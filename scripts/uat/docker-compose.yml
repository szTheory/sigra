services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      dev.sigra.role: demo-db
      dev.sigra.stack: uat
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: example_dev
    ports:
      - "${SIGRA_UAT_PG_BIND:-127.0.0.1}:${SIGRA_UAT_PG_PORT:-}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

  web:
    profiles: ["proxy"]
    build:
      context: ../..
      dockerfile: scripts/uat/Dockerfile.example
      args:
        SIGRA_UAT_ELIXIR_IMAGE: ${SIGRA_UAT_ELIXIR_IMAGE:-elixir:1.19.5-otp-28-slim}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIX_ENV: dev
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: example_dev
      PORT: "4000"
      SIGRA_EXAMPLE_BIND: 0.0.0.0
      SIGRA_EXAMPLE_URL: "http://${SIGRA_UAT_PROXY_HOST:-sigra.localhost}"
    ports:
      - "${SIGRA_UAT_WEB_BIND:-127.0.0.1}:${SIGRA_UAT_WEB_PORT:-}:4000"
    networks:
      - default
      - proxy
    labels:
      - "dev.sigra.role=demo-web"
      - "dev.sigra.stack=uat"
      - "dev.sigra.proxy-host=${SIGRA_UAT_PROXY_HOST:-sigra.localhost}"
      - "dev.sigra.proxy-network=${SIGRA_UAT_PROXY_NETWORK:-proxy}"
      - "traefik.enable=true"
      - "traefik.docker.network=${SIGRA_UAT_PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.${SIGRA_UAT_PROXY_ROUTER:-sigra}.entrypoints=web"
      - "traefik.http.routers.${SIGRA_UAT_PROXY_ROUTER:-sigra}.rule=Host(`${SIGRA_UAT_PROXY_HOST:-sigra.localhost}`)"
      - "traefik.http.services.${SIGRA_UAT_PROXY_ROUTER:-sigra}.loadbalancer.server.port=4000"
    # Deps + build artifacts live in the image (built by Dockerfile.example with
    # cache-correct layers + BuildKit cache mounts). No source bind mount and no
    # caching named volumes: code changes are applied via `docker compose build web`
    # (fast, layer-cached) — `scripts/uat/up.sh --refresh-code` does this. The
    # default host-run mode (`scripts/uat/up.sh` without --proxy) remains the live
    # save->reload path for active development.

  traefik:
    image: ${SIGRA_UAT_TRAEFIK_IMAGE:-traefik:v3.7.1}
    restart: unless-stopped
    profiles: ["private-traefik"]
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    labels:
      dev.sigra.role: demo-proxy
      dev.sigra.stack: uat
    ports:
      - "${SIGRA_UAT_PROXY_BIND:-127.0.0.1}:${SIGRA_UAT_PROXY_PORT:-18080}:80"
    volumes:
      - "${SIGRA_UAT_TRAEFIK_DYNAMIC_DIR:-../../tmp/uat-traefik}:/etc/traefik/dynamic:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:

networks:
  proxy:
    name: ${SIGRA_UAT_PROXY_NETWORK:-proxy}
    external: true
  default:
