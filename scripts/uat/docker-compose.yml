services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      dev.sigra.role: demo-db
      dev.sigra.stack: uat
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: example_dev
    ports:
      - "${SIGRA_UAT_PG_BIND:-127.0.0.1}:${SIGRA_UAT_PG_PORT:-}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
