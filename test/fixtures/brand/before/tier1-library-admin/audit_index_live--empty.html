<section class="sg-stack sg-stack--6">
<span class="sg-scope-ribbon sg-muted sg-text-sm ">
Global audit explorer
</span>
<header class="sg-page-header">
<p class="sg-page-kicker">
Audit evidence
</p>
<h1 class="sg-page-title">
Audit
</h1>
</header>
<nav class="sg-cluster" aria-label="Audit filter presets">
<a href="/admin/audit?outcome=failure" data-phx-link="patch" data-phx-link-state="push" class="sg-btn sg-btn--secondary sg-btn--sm">
Failures
</a>
<a href="/admin/audit?action_prefix=admin.impersonation" data-phx-link="patch" data-phx-link-state="push" class="sg-btn sg-btn--secondary sg-btn--sm">
Impersonation
</a>
</nav>
<form method="get" action="/admin/audit" phx-submit="apply_filters" class="sg-filter-panel sg-stack">
<div class="sg-form-grid sg-form-grid--cols">
<label class="sg-field">
<span class="sg-field-label">
Actor
</span>
<input type="text" name="actor" value="" class="sg-input">
</label>
<label class="sg-field">
<span class="sg-field-label">
Effective user
</span>
<input type="text" name="effective_user" value="" class="sg-input">
</label>
<label class="sg-field">
<span class="sg-field-label">
Action prefix
</span>
<input type="text" name="action_prefix" value="" class="sg-input" placeholder="e.g. auth or admin.impersonation">
</label>
<label class="sg-field">
<span class="sg-field-label">
Outcome
</span>
<select name="outcome" class="sg-select">
<option value="" selected>
Any
</option>
<option value="success">
Success
</option>
<option value="failure">
Failure
</option>
</select>
</label>
<label class="sg-field">
<span class="sg-field-label">
Occurred from
</span>
<input type="date" name="from" value="" class="sg-input">
</label>
<label class="sg-field">
<span class="sg-field-label">
Occurred to
</span>
<input type="date" name="to" value="" class="sg-input">
</label>
</div>
<div class="sg-cluster">
<button type="submit" class="sg-btn sg-btn--primary">
Apply filters
</button>
<a href="/admin/audit" data-phx-link="patch" data-phx-link-state="push" class="sg-btn sg-btn--ghost">
Clear
</a>
<a href="/admin/audit/export.csv" class="sg-btn sg-btn--secondary">
Export CSV
</a>
</div>
<input type="hidden" name="page_size" value="25">
<input type="hidden" name="order_by" value="inserted_at">
<input type="hidden" name="order_direction" value="desc">
</form>
<div class="sg-empty-state sg-stack sg-stack--3 ">
<p class="sg-empty-state__title">
No audit events match this view
</p>
<p class="sg-muted sg-text-sm">
Audit events appear here as activity is recorded. Adjust the filters above to focus on a specific actor, outcome, or time range.
</p>
</div>
</section>
