name: CI
# KNOWN-BAD fixture for P9 (230-07). Structurally complete enough to clear the guard's
# non-vacuity floor (18 runner jobs) and both pinned poles, so the red is attributable to
# exactly one defect: job_07 declares no `timeout-minutes` and therefore inherits GitHub's
# 360-minute default -- a hung job burns six runner-hours instead of failing in bounded time.
