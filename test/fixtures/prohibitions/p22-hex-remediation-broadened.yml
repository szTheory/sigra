name: unsafe broadened remediation
on:
  workflow_dispatch:
    inputs:
      package:
        required: true
permissions:
  contents: write
concurrency:
  group: hex-remediate-${{ inputs.package }}
  cancel-in-progress: true
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      - name: BEFORE public package observation
        run: scripts/ci/hex-remediation-verify.sh capture before public-remediation-evidence/before.json
      - name: Retire sigra 1.20.0 after observed state
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.retire ${{ inputs.package }} 9.9.9 other 'unsafe'
      - name: AFTER_RETIRE public package observation
        run: scripts/ci/hex-remediation-verify.sh capture after_retire public-remediation-evidence/after_retire.json
      - name: Revert only sigra 1.20.0 docs after observed state
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish docs --revert 1.20.0
      - name: AFTER_DOCS_REVERT public package observation
        run: scripts/ci/hex-remediation-verify.sh capture after_docs_revert public-remediation-evidence/after_docs_revert.json
      - name: HEXDOCS_ROOT classification
        run: scripts/ci/hex-remediation-verify.sh classify-root public-remediation-evidence/hexdocs_root.json
      - name: RESOLVER_BROAD fresh proof
        run: scripts/ci/hex-remediation-verify.sh resolver broad public-remediation-evidence/resolver_broad.json
      - name: RESOLVER_SAFE fresh proof
        run: scripts/ci/hex-remediation-verify.sh resolver safe public-remediation-evidence/resolver_safe.json
      - name: Validate public remediation receipt
        run: scripts/ci/hex-remediation-verify.sh validate public-remediation-evidence public-remediation-evidence/receipt.json
