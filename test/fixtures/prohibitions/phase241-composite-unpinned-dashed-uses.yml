name: Boot example app for Playwright
description: Known-bad composite action fixture: its dashed setup-node reference floats.

inputs:
  database-name:
    required: true
  app-port:
    required: true

runs:
  using: composite
  steps:
    - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      id: setup_beam
      with:
        version-file: .tool-versions

    - uses: actions/setup-node@v6 # v7.0.0
      with:
        node-version: "20"

    - name: Cache example dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: test/example/deps

    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
